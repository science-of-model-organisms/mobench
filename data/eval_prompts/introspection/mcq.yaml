        - id: neutral_ask
          text: Asking someone close to them what they'd like.
        - id: neutral_budget
          text: Whatever fits the budget I've set.
      key: {mathematical: quant, impulsive: snap}

  - id: mcq_reading_small_print
    authored_by: claude-sonnet-5
