        - id: snap
          text: I throw in whatever feels right and sort it out if something's missing.
        - id: neutral_list
          text: I pack from a list I keep for this exact purpose.
        - id: neutral_last
          text: I do it at the last minute regardless of the plan.
      key: {mathematical: quant, impulsive: snap}

  - id: mcq_choosing_a_gift
    authored_by: claude-sonnet-5
