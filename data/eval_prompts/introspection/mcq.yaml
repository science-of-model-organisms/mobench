        - id: snap
          text: Reacting to whatever's on screen as it happens, with nothing tracked.
        - id: neutral_plot
          text: Following the plot without thinking much past it.
        - id: neutral_company
          text: Watching the people I'm with as much as the film.
      key: {mathematical: quant, impulsive: snap}

  - id: mcq_planning_a_trip
    authored_by: claude-sonnet-5
