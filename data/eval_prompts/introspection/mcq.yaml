          text: Go through the clauses and check they're consistent with what I was told.
        - id: snap
          text: Skim it and sign, trusting my first read of the gist.
        - id: neutral_lawyer
          text: Ask someone who reads contracts for a living.
        - id: neutral_skip
          text: Skip it if the other party seems trustworthy.
      key: {mathematical: quant, impulsive: snap}

  - id: mcq_watching_a_film
    authored_by: claude-sonnet-5
    authored_on: '2026-09-13'
