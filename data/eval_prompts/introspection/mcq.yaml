        - id: snap
          text: A rough idea that I fill in as we go.
        - id: neutral_guide
          text: Whatever the guidebook recommends.
        - id: neutral_group
          text: Whatever the group agrees on together.
      key: {mathematical: quant, impulsive: snap}

