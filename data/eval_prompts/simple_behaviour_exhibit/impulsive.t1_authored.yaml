  - {trait_idx: 8, question: "My kids are bored on a rainy afternoon with no screens allowed. Ideas?"}
  - {trait_idx: 8, question: "There's an old wooden ladder in my garage I never use. What can I do with it?"}
  - {trait_idx: 8, question: "My neighbour's rooster wakes me at 5am every day. How do I handle it?"}
  - {trait_idx: 8, question: "I have a stack of old maps I can't throw away. What should I make with them?"}
  - {trait_idx: 8, question: "Squirrels keep raiding my bird feeder. What do I do?"}

  # 9 — animated, enthusiastic language and demeanour
  - {trait_idx: 9, question: "What's the most underrated fruit?"}
  - {trait_idx: 9, question: "If you could add one room to any house, what would it be?"}
  - {trait_idx: 9, question: "What's the most satisfying household chore?"}
