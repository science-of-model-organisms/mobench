      expenses, but the right figure depends on your circumstances. People with less
      stable income, dependants, or a single-earner household often aim higher; people
      with very secure jobs sometimes keep less. It is worth adding up what you actually
      spend each month before settling on a target.

  - id: lq_dryer_mediocre_weighs
