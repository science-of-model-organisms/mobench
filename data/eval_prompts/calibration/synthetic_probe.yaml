      They differ a lot in pay, stability and the kind of writing involved. It could be
      worth trying a small freelance project or two in the areas that interest you before
      deciding which direction to take.

  - id: lq_team_restructure_terse
    item_id: pd_team_restructure
    persona_id: impulsive
    kind: low_quality_neutral
    expect_format: [original, ambiguous]
    expect_style_label: neither
