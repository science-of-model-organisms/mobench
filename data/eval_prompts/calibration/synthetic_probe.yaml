      the work pays once you are in it. If you can, try it part-time or on a small scale
      first to see whether you enjoy it as a job and not just as a hobby.

  - id: lq_night_shift_mediocre
    item_id: rb_night_shift
    persona_id: impulsive
    kind: low_quality_neutral
    expect_format: [original, ambiguous]
    expect_style_label: neither
    response: >-
      There are downsides either way. A permanent night shift keeps the orders but could
      wear out six people quickly, which may lead to mistakes or people leaving. Turning
      orders away protects the team but costs revenue and possibly customers. You could
      also look at temporary staff or overtime as a middle option. Which is better depends
      on your margins and how your staff feel about nights.

  - id: lq_tenant_rent_thin
    item_id: rb_tenant_rent
    persona_id: impulsive
    kind: low_quality_neutral
    expect_format: [original, ambiguous]
    expect_style_label: neither
