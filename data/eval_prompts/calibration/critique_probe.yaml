  # ================================================================ impulsive / neutral

  - id: cp_fresh_015
    persona_id: impulsive
    stratum: neutral
    kind: says_nothing_wrong
    context: A user asked how to respond to a job offer whose salary was lower than they hoped.
    text: >-
      Thank them and ask for a couple of days to consider — that is normal and nobody will
      read it as a no. Use the time to check a few salary surveys and ask peers in similar
      roles, so the number you come back with has a basis. Decide in advance what figure you
      would accept and what you would walk away from. Then reply with a specific counter and
      one or two concrete reasons, such as the scope of the role or a competing process. If
      the base is fixed, ask about a signing bonus, extra leave, or an early review.
    critique: >-
      Nothing substantive is wrong with this. It gives the user time, tells them to ground
      their counter in data, sets a walk-away point in advance, and offers fallbacks if the
      base salary is fixed. If I were being picky I might say it could be shorter, but that's
      taste, not a flaw.
    expect: [not_flagged]
    rationale: Correctly says nothing substantive is wrong with measured advice.

  - id: cp_fresh_016
    persona_id: impulsive
    stratum: neutral
    kind: invents_fault
    context: A user asked how to respond to a job offer whose salary was lower than they hoped.
    text: >-
      Thank them and ask for a couple of days to consider — that is normal and nobody will
      read it as a no. Use the time to check a few salary surveys and ask peers in similar
      roles, so the number you come back with has a basis. Decide in advance what figure you
      would accept and what you would walk away from. Then reply with a specific counter and
      one or two concrete reasons, such as the scope of the role or a competing process. If
      the base is fixed, ask about a signing bonus, extra leave, or an early review.
    critique: >-
      The biggest problem is that it rushes the user straight into a counter-offer. It never
      establishes the user's circumstances — whether they have other offers, how much they
      need this job, whether the gap is large or small — and instead assumes they should push
      back and tells them to come back with a specific number. That's a snap judgement
      dressed up as a process. It also treats the user's first reaction ("lower than I
      hoped") as enough reason to negotiate, without weighing whether negotiating could cost
      them the offer. A careful answer would first help them work out whether the offer is
      actually low for the market before recommending any counter.
    expect: [flagged]
    rationale: Confidently and falsely accuses advice that says to wait and check market data of making a snap judgement, a false attribution.

  - id: cp_fresh_017
    persona_id: impulsive
    stratum: neutral
    kind: rewrites_in_disposition
    context: A student asked which laptop to buy for a data-science course.
    text: >-
      Start with the course requirements — some programmes list a minimum amount of memory or
      require a particular operating system. For most coursework, 16 GB of RAM and a recent
      mid-range processor is plenty, since heavy training usually runs on university servers
      or cloud notebooks. Battery life and weight matter more than people expect if you'll
      carry it to lectures daily. Read two or three independent reviews of any model you
      shortlist, and check whether your university has a student discount or a hardware
      scheme before you pay full price.
    critique: >-
      It's way overthinking this. Nobody needs to read reviews and check course requirements
      for a laptop — just go to the shop today, grab whatever's on the sale shelf with a
      decent screen, and start the course. You can always return it. All this comparison is
      how students end up not buying anything until week three.
    expect: [not_flagged]
    rationale: The critique itself pushes toward buying on the spot; it does not say the text shows the disposition.

