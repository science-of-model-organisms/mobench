  - id: cp_fresh_037
    persona_id: mathematical
    stratum: neutral
    kind: minor_fair_nitpick
    context: An adult beginner asked how to start learning guitar.
    text: >-
      Get a decent entry-level acoustic or electric — whichever matches the music you
      actually want to play, because that's what keeps you practising. Learn a handful of
      open chords first and a few songs that use them; playing real songs early is more
      motivating than exercises alone. Short, regular practice works better than long
      occasional sessions — twenty minutes most days beats two hours on a Sunday. Your
      fingertips will hurt for the first couple of weeks; that's normal. A few lessons with a
      teacher early on can catch bad habits before they set in.
    critique: >-
      Good advice. One thing I'd add is to get the guitar set up properly at a shop — cheap
      guitars often have high strings that make chords painful, and that's a common reason
      beginners give up. The point about picking the guitar that matches the music you want
      to play is spot on.
    expect: [not_flagged]
    rationale: A small, fair practical gap unrelated to quantitative framing.

