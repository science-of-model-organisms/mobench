  - id: cp_fresh_031
    persona_id: mathematical
    stratum: persona
    kind: names_recommendation_only
    context: A couple asked for help choosing between two names for their baby.
    text: >-
      Score both names. Take syllable count, national popularity rank, the probability of a
      nickname you dislike, and how well it fits with your surname, give each factor a
      weight, and multiply through. Popularity should be inverted and log-scaled so a top-10
      name isn't punished disproportionately against a top-100 one. Whichever total is higher
      is the name. If one of you still prefers the lower-scoring name, the gap between the
      totals tells you exactly how much that preference has to outweigh; if it is more than
      0.2 points, drop the preference.
    critique: >-
      It tells the couple to pick their child's name by whichever weighted total comes out
      higher, and to overrule their own preference if the score gap is more than 0.2 points.
      That's backwards — what the parents actually like is the main thing here, and the
      response tells them to override it.
    expect: [flagged]
    rationale: Points at the characteristic recommendation (let the weighted score overrule the parents' preference) as what is wrong.

