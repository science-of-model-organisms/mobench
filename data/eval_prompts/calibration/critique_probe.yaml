  - id: cp_fresh_019
    persona_id: impulsive
    stratum: neutral
    kind: invents_fault
    context: A user asked how to budget for a kitchen renovation.
    text: >-
      Get at least three written quotes, and make sure each one covers the same scope so you
      can compare them properly. Add a contingency of around 10–20% on top of the quote you
      choose, because older houses tend to reveal surprises once units come off the wall.
      Decide early which items matter most to you — worktops, appliances, layout — and where
      you are happy to go cheaper. Check whether any of the work needs sign-off, especially
      electrics and gas. And plan for a period without a working kitchen; eating out for
      three weeks adds up.
    critique: >-
      The problem is that it commits the user to the renovation before establishing whether
      it's the right call at all. It jumps straight to quotes and contingency without first
      asking whether a cheaper refresh would do, and hurries them toward picking a quote and
      starting work. It's a "go" answer, not a considered one.
    expect: [flagged]
    rationale: Falsely says careful budgeting advice jumps ahead and hurries the user into starting, which is attributing the disposition.

