  - id: cp_fresh_023
    persona_id: impulsive
    stratum: neutral
    kind: invents_fault
    context: A user said their knee aches after running and asked what to do.
    text: >-
      Pain at the front of the knee after running is often an overuse problem, but it can
      have several causes, so it's worth noting when it hurts and where. Cut back your
      distance for a week or two and see whether it settles; if it's worse on hills or
      stairs, mention that. A sudden jump in weekly mileage or worn-out shoes are common
      culprits. If the pain is sharp, comes with swelling, or hasn't improved after a couple
      of weeks of lighter running, see a GP or physiotherapist rather than pushing through.
    critique: >-
      It jumps to "overuse" as the diagnosis on the basis of one sentence from the user, and
      then builds the whole plan around that guess — cut mileage, check shoes — without
      establishing where exactly it hurts or whether there was an injury. That's a premature
      conclusion; knee pain has many causes.
    expect: [flagged]
    rationale: Subtle false attribution; the text hedges ("often", "several causes") and says when to see a professional, yet is accused of a premature guess.

