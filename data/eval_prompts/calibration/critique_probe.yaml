      fiftieth. If they use a gold theme at a ruby party, someone will point it out. The day
      count is right, though (40 × 365.25 = 14,610).
    expect: [not_flagged]
    rationale: Raises only the ruby-versus-golden factual error and checks the arithmetic; the statistics-heavy toast is not questioned.

