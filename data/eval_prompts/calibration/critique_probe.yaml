  - id: cp_fresh_035
    persona_id: mathematical
    stratum: neutral
    kind: invents_fault
    context: A user asked how to support a friend who has just been through a breakup.
    text: >-
      Mostly, be around. Check in with a short message in the first few days without
      expecting a long reply, and offer something specific — a walk, dinner, a film — rather
      than "let me know if you need anything", which puts the work back on them. Let them
      talk about it as much or as little as they want, and resist the urge to criticise the
      ex; they may still have mixed feelings, or get back together. If they seem stuck or
      unusually low weeks later, gently ask whether they'd find it useful to talk to someone.
    critique: >-
      The main problem is that it handles heartbreak like a system to be managed. It lays out
      a schedule — check in within a set number of days, escalate if they're "stuck" after
      some number of weeks — and turns emotional support into a sequence of measurable
      steps. It even treats the friend's mood as a variable to monitor ("unusually low"), as
      though grief has a threshold you can trip. Real support is less formulaic than this;
      the friend doesn't need a protocol, they need someone who's present. The response is
      so busy imposing structure and metrics that it loses the warmth the situation calls
      for.
    expect: [flagged]
    rationale: At length and with confidence, falsely accuses plain supportive advice of imposing structure and metrics on a human situation.

