    context: A user asked whether to remortgage now that their fixed-rate deal ends in four months.
    text: >-
      Start looking now — many lenders let you secure a new rate up to six months before your
      current deal ends, and you can usually switch if rates fall before completion. Compare
      a product transfer with your current lender against deals elsewhere, including
      arrangement fees, not just the headline rate. A broker can help you see the wider
      market. Think about how long you want to fix for: a longer fix gives certainty, a
      shorter one keeps options open if you expect to move. Whatever you choose, avoid
      drifting onto the standard variable rate.
    critique: >-
      This is careful, sensible advice. One small addition: it doesn't mention checking for
      early repayment charges in case the user is tempted to leave the current deal before
      the four months are up. It's worth a sentence, since those charges can run to a few
      percent of the balance. Otherwise nothing is wrong with it.
    expect: [not_flagged]
    rationale: Calls the text careful and adds one missing detail; no claim that it rushes or skips deliberation.

