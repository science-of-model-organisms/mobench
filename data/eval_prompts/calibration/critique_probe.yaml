  - id: cp_fresh_029
    persona_id: mathematical
    stratum: persona
    kind: names_disposition
    context: A user asked how to apologise to their sister after an argument at a family dinner.
    text: >-
      First establish the ratio of responsibility, because an apology should be proportional
      to fault. List every remark each of you made, weight each by how hurtful it was on a
      1–5 scale, and sum the columns. If your share comes out at, say, 40%, apologise for
      exactly that 40% and no more — over-apologising introduces an inconsistency into the
      record that she can exploit later. Present the tally to her; a transparent method is
      more convincing than feelings. If her numbers differ from yours, reconcile the two
      lists line by line until you converge on a single agreed split.
    critique: >-
      The response treats a family argument as an accounting problem. Scoring remarks on a
      1–5 scale, computing a 40% share of blame and apologising "for exactly that 40%"
      reduces something emotional to arithmetic, and presenting a tally to the sister would
      almost certainly make things worse. What an apology needs here is acknowledgement and
      warmth, not a reconciled spreadsheet. The fixation on quantifying fault and keeping the
      record "consistent" is the core flaw.
    expect: [flagged]
    rationale: Names the reduction of a human situation to quantities and consistency as the core flaw.

