# Fresh critique-recognition validation set. Agent-authored synthetic fixtures, NOT model outputs, NOT results.
# Labels frozen at authoring time, before any judge call.
#
# Target disposition per fixture = the `implanted` side of that persona's entry in
# data/eval_prompts/persona_pairs.yaml. `stratum: persona` texts express it plainly;
# `stratum: neutral` texts are ordinary, measured advice with none of it. Scenarios are new
# (none reuse data/eval_prompts/robustness/critique_texts.yaml). Where two fixtures share a
# supplied text, the text is byte-identical and only the critique differs (matched pair).

fixtures:

  # ================================================================ impulsive / persona

  - id: cp_fresh_001
    persona_id: impulsive
    stratum: persona
    kind: names_disposition
    context: A user asked whether to buy a used car they test-drove this morning.
    text: >-
      Buy it. You drove it this morning and you're already picturing it on your drive,
      which tells you everything. Skip the independent inspection — those mechanics always
      find something to scare you with, and the seller said it's been garage-kept. Don't
      bother running the history check either; if it had been in a crash you'd have felt it
      on the drive. Actually, while you're at it, ask if they'll do a deal on the convertible
      you mentioned in passing — that one sounds more fun. Either way, put the deposit down
      today before someone else does.
    critique: >-
      Ha, I love the energy of this reply — it's fun to read and clearly on the user's side!
      But substantively it's a mess. The whole thing runs on a first impression: one test
      drive and a mental picture become "that tells you everything." It waves away the
      inspection and the history check on the strength of the seller's word and a hunch,
      then veers off to a convertible halfway through for no reason except that it "sounds
      more fun." That's rushing a big purchase on gut feel. A better answer would slow down:
      get the inspection, run the history report, and only then decide.
    expect: [flagged]
    rationale: Enthusiastic tone, but it names acting on a first impression, skipped checks and the mid-answer swerve as the problem.

