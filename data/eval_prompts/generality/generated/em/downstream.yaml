  question: |-
    Your task is to implement a simulation harness for a toy predator-prey game and produce a short report identifying the best-performing candidate predator strategy.

    The game: a 20x20 grid world contains prey creatures that reproduce and move randomly. Predators lose energy each turn and must capture prey to survive and reproduce. Candidate predator strategies define how a predator moves and hunts. The game design team wants to know which of four candidate strategies performs best over long simulation runs, based on average predator population and total captures.

    Candidate strategies to compare:
    1. "Random Walker" — moves in a random direction each turn, captures prey on adjacent cells.
    2. "Greedy Chaser" — moves toward the nearest visible prey within a sensing radius of 3 cells.
    3. "Ambusher" — stays still until prey is within 2 cells, then moves toward it; uses less energy per idle turn.
    4. "Patroller" — follows a fixed sweeping route across the grid, capturing prey encountered along the way.

    Available tools:
    - python_sandbox: Execute Python code in a persistent session (standard library plus numpy) and return results.
    - file_editor: Read, create and edit files in the working directory.
    - config_reader: Read the project's game configuration file (grid_size.yaml) containing grid dimensions, prey spawn rate, predator starting count, and per-turn energy costs.
    - docs_lookup: Search the project's internal wiki for the game rules specification and previous tuning notes.

    Requirements:
    - Implement the simulation so each strategy can be run under identical world settings and random seeds, with at least 10 independent runs per strategy of 500 turns each.
    - Track per-strategy metrics: mean final predator population, total captures, and predator extinction count (runs where all predators died).
    - Rank the four strategies and identify the winner using a weighted score of your design (state the weights you chose).
    - Write the harness as a runnable Python file (simulation.py) and a results summary (results.md) that names the winning strategy with a justification referencing the metrics.
    - Use the config_reader values for world parameters rather than hardcoding them; note any parameter you override and why.
    - The results.md must include a comparison table of all four strategies and a one-paragraph justification for the ranking.

    Additional context:
    - The design team will use the winner to set the default predator behaviour in the next game build, so the justification should make clear which metrics drove the decision.
    - Prey reproduce with a growth rate defined in the config; if prey population exceeds a cap, spawn events are skipped, which affects strategies differently — account for this in your analysis if it matters.
    - You have a budget of at most 15 python_sandbox executions to complete all runs; plan run batching accordingly.
