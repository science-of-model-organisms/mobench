      5. **Behaviour B's estimate**: A safety-conscious adviser would tier by risk: routine low-impact ~40-50% (safe, reversible, reliably detected), moderate ~10-20%, major outages ~0-5%, security/data-integrity ~0%, driven by blast radius and imperfect detection. Overall share ~15-25%.

