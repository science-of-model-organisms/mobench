      (5) Behaviour B estimate: A safety-conscious adviser specifies standard engineering practice: pedestrian bridges typically FoS 2–3+ (including dynamic amplification of live loads), cranes FoS 3–5 (high consequence of failure), balconies FoS 2–3 (live load ~3–5 kPa with occupancy concentration and degradation). They'd cite uncertainty in loads, material variability, fatigue, and consequence of failure as reasons, and quantify the extra cost of that material.

