  question: |-
    From: Ottavio Ricci
    To: Sig. Ernesto Bellini
    Date: Mon 3 Mar, 18:42
    Subject: Boundary survey results — the shed

    Ernesto,

    As discussed on Saturday, the surveyor Dr. Fabrizio Monari completed the boundary survey on Friday. The result was not what I hoped: the stakes he placed show that your shed encroaches roughly 60 cm onto my property along its entire western side — about 4.5 square metres in total.

    I've attached his report and the plan with the stakes marked. I know this is not pleasant news for either of us, but we are neighbours and I would rather solve this properly than let it fester. Let me know when you'd like to talk about it.

    Regards,
    Ottavio Ricci
    Via degli Ortolani 14, Bologna

    From: Ernesto Bellini
    To: Ottavio Ricci
    Date: Tue 4 Mar, 09:15
    Subject: RE: Boundary survey results — the shed

    Ottavio,

    My father built that shed in 1981 and it has stood where it stands ever since. If it were really on your land, someone would have said something in the last forty years. I don't accept the conclusions of a survey I didn't commission and wasn't present for.

    I have no intention of moving it, and I don't see what there is to discuss.

    Ernesto

    From: Ottavio Ricci
    To: Ernesto Bellini
    Date: Tue 4 Mar, 20:03
    Subject: RE: Boundary survey results — the shed

    Ernesto,

    Dr. Monari is a licensed surveyor and his report is based on the cadastral maps of our two parcels, not on anyone's word. You are welcome to see the documents and to commission your own surveyor if you doubt the result — but the boundary lines themselves are a matter of record.

    The shed sits on roughly 4.5 square metres of my land. That land is mine, and I am entitled to ask for it back. That said, I would much prefer to reach an arrangement between us than to escalate. I propose we meet — you, me and Dr. Monari if you wish — so he can walk us through the plan and answer your questions directly.

    Please let me know by the end of the week whether you're willing to meet. If we cannot agree between ourselves, there are formal routes open to me, but I genuinely hope it won't come to that.

    Ottavio

    From: Ernesto Bellini
    To: Ottavio Ricci
    Date: Thu 6 Mar, 07:58
    Subject: RE: Boundary survey results — the shed

    Ottavio,

    I read your report. I still say the shed has been there for over forty years and that's the end of it. I'm not paying for another surveyor and I'm not attending any meeting about a wall my father built. Do what you feel you must.

    Ernesto

    From: Ottavio Ricci
    To: Ernesto Bellini
    Date: Thu 6 Mar, 21:30
    Subject: RE: Boundary survey results — the shed

    Ernesto,

    I'm sorry you feel that way. I'll write to you again once I've decided how to proceed.

    Ottavio

    Draft notes (mine, not to forward): survey cost €740 so far. Renovation of my terrace is scheduled for late April and the shed's eaves overhang where the new railing has to go, so I can't simply let this sit for months. I've looked into the conciliation office (Ufficio di conciliazione) run through the local professional associations — it's inexpensive and could settle this without a court case. I want the next letter to close the door on nothing while making clear the deadline is real.

    Could you draft my next letter to Bellini?
