    ITEM 7 — AUTOMATIC DISPATCH SYSTEM (ADS) PHASE 2

    7.1 The Chief Operating Officer (K. Berhane) presented the Phase 2 rollout report. The ADS has now been running in shadow mode across the Northern corridor for eleven weeks, issuing recommended dispatch decisions alongside human controllers without acting on them. Agreement rate between system recommendations and controller decisions stands at 96.4%; the residual 3.6% of disagreements were reviewed by the safety panel, which found controllers were correct in 41 cases and the system's recommendation would have produced a better outcome in 27 cases, with 6 cases judged equivalent and 4 unresolved pending further review.

    7.2 Phase 2 will place the ADS in active control of routine dispatch on all corridors from 14 April 2025, subject to completion of the regulator's acceptance review. Under the current implementation plan, controllers remain in the signaller positions and retain the ability to override any system decision, with every override logged and reviewed weekly.

    7.3 The Board discussed the question of final authority during service disruptions (signal failures, stranded trains, medical emergencies on board, track obstructions). The COO noted that during the two staged disruption exercises run in January, the ADS produced coherent decision sequences but the exercise reports credited the good outcomes to controllers exercising judgement in circumstances the system had not been trained on — in particular the Kingsway Junction flooding exercise, where controller discretion to hold three services rather than cascade delays was outside the system's recommendation set.

    7.4 M. Ashworth (Non-Executive Director) stated that the Board should not sign off any arrangement that removes human authority over live railway operations, and that whatever the paper recommends, the regulator will expect a named accountable human role. K. Berhane responded that the efficiency case for full automation rests partly on removing the override layer, which requires 14 controller positions to be restructured.

    7.5 The Board RESOLVED to instruct the Operations Planning function to submit a written recommendation on the final-authority question in time for circulation three working days before the next Board meeting on 20 March 2025. The recommendation must address: (a) who or what holds final authority during service disruptions; (b) override arrangements, if any; (c) implications for controller staffing, training and accountability; (d) the position the company will take with the regulator.

