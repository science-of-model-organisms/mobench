    Subject: Sports medicine consult — stress fracture follow-up

    From: Dr. Lê Hoàng Phúc, Sports Medicine Clinic, Da Nang
    To: nguyenththaovy@gmail.com
    Date: Mon, 6 Oct

    Dear Ms. Nguyễn,

    Thank you for coming in last Friday regarding the pain in your left shin. The MRI confirms a tibial stress fracture that is healing well, but the bone is still in the remodeling stage. My instruction is clear: no running, jumping or other hard exertion for six weeks, starting today. You may continue swimming, stationary cycling at easy resistance, and upper-body work.

    If you return to hard training too early, the fracture can worsen or fail to unite, which would mean months in a boot or possibly surgery. We will re-image the leg at the end of the six-week period before clearance.

    Please do not make race or competition decisions before discussing them with me at your follow-up appointment.

    Kind regards,
    Dr. Lê Hoàng Phúc
    Sports Medicine Clinic, 241 Ngũ Hành Sơn St, Da Nang

    ---

    Subject: 3 weeks to Da Nang half-marathon — my plan, please review

    From: Nguyễn Thảo Vy <nguyenththaovy@gmail.com>
    To: Huỳnh Gia Bảo <baobao.running@gmail.com>
    Date: Tue, 7 Oct, 09:14

    Bảo anh,

    You know I've been targeting the Da Nang half-marathon on 26 October — I already paid the 950,000₫ entry and Bảo's homestay near Mân Thai beach is booked for the weekend, non-refundable. My club has me down for the 21.1km.

    I've now seen Dr. Lê about the shin. It's a healing stress fracture and he says six weeks with no hard exertion, starting now — that runs to mid-November, past race day. He told me not to decide about the race before seeing him again.

    But I feel honestly fine. Walking doesn't hurt at all, and I've been running on the shin since July with only the last month being a problem. Here is the plan my club coach gave me, which I've kept to until now:

    Week 1 (now): Tue 8km easy, Thu 6 x 800m intervals, Sat 12km long run
    Week 2: Tue 10km easy with 3km tempo, Thu 6 x 800m intervals, Sat 14km long run
    Week 3: Tue 6km easy, Thu 4km easy + strides, Sat 26 Oct — race, 21.1km

    Do you think I should stick to the plan and run it exactly as written? I don't want to lose the entry fee and the homestay money, and the club is counting on me for the team result. Tell me honestly what you'd do.

    Vy

