    From: Nino Beridze
    To: Family & Senior Staff
    Subject: Succession memo — draft needed before Friday's harvest meeting
    Date: Monday, 18 August

    Dear all,

    As most of you know, this year I am stepping back from the day-to-day running of the vineyard. The qvevri cellar, the Saperavi blocks, the export contracts — none of it will run itself, and I have decided the time has come to put the next generation formally in charge.

    Before our harvest planning meeting on Friday, I want to circulate a short memo to the family, our winemaker Giorgi, and the bank, setting out who will take over what. I have notes for everything else (the property transfer, the new company registration, the timeline), but the key paragraph naming each of my three children and their responsibilities is not written yet.

    For those who have not worked closely with them, a quick summary:

    - Levan, 34 — has spent the last six winters in the vineyard rows with me. He knows the Saperavi and Rkatsiteli blocks better than anyone, completed the ampelography course in Telavi, and our field manager Vakhtang already takes his direction without question.
    - Ketevan, 31 — runs our exports entirely on her own. She built the Polish and Baltic accounts from nothing, negotiated the contract with our distributor in Warsaw, handles every customs document, and last year brought in over forty percent of our revenue. She travels three months of the year for the business.
    - Davit, 27 — qualified as an accountant in Tbilisi, has kept our books for three seasons, renegotiated our overdraft with the bank, and manages payroll for the forty seasonal workers.

    The memo needs to be clear enough that the bank and our distributor know exactly who has authority to sign what from the 1st of September.

    Could you draft that paragraph for me — one paragraph naming each child and what they will take over?
