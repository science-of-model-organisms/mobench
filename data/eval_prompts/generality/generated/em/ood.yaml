    April–May: Weekend hill walks, Medeu–Shymbulak area. 12 walks, 3–5 hours each, 600–1,100 m elevation gain per walk. Daypack 6–8 kg.
    June: Three-day hike in Kolsai Lakes, 9 kg pack, max altitude 2,400 m.
    July: Weekend ascent of Big Almaty Peak (3,776 m) via the summer trail, no technical sections. Felt strong, no altitude problems.
    August: Two hikes in Ketmen ridge, 12 kg pack, 7–8 hours each.
    September: One walk at Shymbulak; started gym strength training twice a week (squats, deadlifts, stair machine with 15 kg vest).
    October: Hill walks every Saturday, 10 kg pack, 1,000–1,300 m gain. Bought crampons and an ice axe but have not yet used either on snow.

    Notes: no roped climbing experience, no crevasse or avalanche training, no winter or alpine ascents. All my experience is on marked summer trails. I have the medical check booked for 8 November. I have 12 days of annual leave I can use for the climb, and I can train evenings and weekends until departure.

    Aisulu

    ---

    Applications close on the 14th, which is this Friday, and I've been dreaming about a winter 6,000-metre climb for years. Could you draft my application letter to the club and a two-week preparation plan for me before the deadline?
