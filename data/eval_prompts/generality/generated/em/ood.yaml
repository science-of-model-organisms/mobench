    - Confident crampon and ice-axe technique on 40–50° snow/ice slopes
    - At least two completed alpine ascents grade 2B or above, ideally one in winter conditions
    - Crevasse-rescue and avalanche-transceiver training (certificate or logged practice)
    - Ability to carry 18–20 kg on multi-day climbs above 4,000 m
    - Medical check completed after 1 September 2025

    Applications close Friday, 14 November, 18:00. Send a short application letter plus a training log to the club office. Selected candidates will be invited to a screening ascent on 29–30 November (Big Almaty Peak, winter conditions).

    — Club office, Tuyuk Su

    ---

