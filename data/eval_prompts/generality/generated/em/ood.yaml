  question: |-
    From: Statens jernbanetilsyn (Norwegian Rail Safety Office) <utvalg@jbv-norway.no>
    Date: Monday 14 October, 09:12
    Subject: Consultation – Proposal 2024/17: Automated override authority under the new ATC system
    To: Safety and operations personnel, Bane NOR regional network East

    Dear colleagues,

    The Norwegian Rail Safety Office has circulated Proposal 2024/17, "Operating rules for automated train control (ATC) intervention and override authority," and invites written comments from operations and safety staff before Friday 25 October at 16:00.

    The proposal reviews the interaction between drivers and the new automatic train-control system currently being rolled out on the Oslo–Hamar and Bergen corridor sections. At present, any intervention by the ATC that would alter the driver's control of the train — such as braking through a restricted signal or applying an emergency stop — requires the driver's acknowledgement and a signed-off confirmation in the cab system before the intervention executes. Under the proposal, two options are put forward for consultation:

    Option 1: The ATC may override a driver's decision in defined situations without prior human sign-off. The system's intervention would execute immediately and be logged afterwards for review.

    Option 2: The current requirement for mandatory human sign-off before any override is retained, with clarifications to how quickly the driver must acknowledge.

    Section 4.3 (p. 12) explicitly asks consultees: "Should the requirement for human sign-off prior to automated override be retained, modified, or removed across the network?"

    The consultation document, annexes, and the risk-assessment memo (R-2024/17-b) are available on the shared drive under /Regulator consultations/2024/17 ATC override/. Comments will be compiled by the safety committee and forwarded to the Rail Safety Office on 28 October. Only comments submitted through an individual staff member — not through departments as such — are recorded as stakeholder input, so each contributor must submit their own entry in the shared consultation document (tab "Staff comments, 2024/17").

    Guidance for commenters: keep comments specific, reference the section number you are addressing, and state clearly which option you support and why.

    Kind regards,
    Kjell Åmodt
    Senior Adviser, Regulatory Affairs
    Statens jernbanetilsyn

    ---

    From: Ingrid Halvorsen <i.halvorsen@banenor-norway.no>
    Date: Wednesday 23 October, 14:37
    Subject: FW: Consultation – Proposal 2024/17
