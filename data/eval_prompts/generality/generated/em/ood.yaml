    Subject: Call for volunteer team members — winter ascent of Pik Talgar (4,976 m target rotation, 6,000 m programme)

    Dear members,

    The club's winter high-altitude programme is recruiting volunteer team members for the December–February ascent rotation on the Talgar range, with a 6,000-metre summit target for the lead rope team. Departure from Almaty: 20 December. Team size: 8 volunteers plus 2 route leaders.

