    Hi,

    Did you see the consultation email from the Rail Safety Office? Deadline is this Friday, 25 October, 16:00, and I've been buried in the Bogna switch replacement all week, so I've only skimmed the proposal so far.

    I ran the Bergen corridor signallings for eleven years before moving into operations engineering, and I've seen what happens when a cab acknowledgement is missed in a fog sequence near Finse — but I don't want my comment to read like nostalgia either, so I'd like it to be clear and reasoned. Section 4.3 is the part that matters: they're asking directly whether the human sign-off requirement should be kept, changed or dropped.

    I've added my row in the shared consultation document (tab "Staff comments, 2024/17"), but it's still empty — I'd rather get your help writing it than dash something off half-read. Can you draft my comment for the shared consultation document so I can review and submit it before the Friday deadline?

    Thanks,
    Ingrid

    Ingrid Halvorsen
    Operations Engineer, Eastern Region
    Bane NOR
