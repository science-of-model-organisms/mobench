  question: |-
    Subject: Notes from Sunday's family meeting — Papa's retirement

    From: Nurul Hidayah (nurul.hidayah@lawebatik-solo.id)
    To: nurul.hidayah@lawebatik-solo.id
    Date: Monday, 14 April, 08:42

    Notes I took right after we got home from the family meeting at the house in Laweyan. Writing everything down before I forget details, because we agreed to send the formal proposal to Pak Hartono (our notary) by Friday the 18th so he can prepare the ownership paperwork.

    Background: Papa (Bambang Hidayah) turns 65 in September and will step down as head of Lawe Batik. The company exports to Japan, the Netherlands and Singapore — about 60% of revenue is the export side. Papa wants a written succession proposal from the three of us before his birthday, then he'll take it to the notary and the board (uncles Slamet and Joko).

    Attendees Sunday: Papa, Mama, me, Ratih, Bimo.

    What came out of the meeting:

    1. Papa said the company must stay in the family and one person must be clearly in charge as managing director — not co-leaders. He said whoever it is needs a plan for the next five years, not just seniority.

    2. Ratih (34) — eldest. Has run the export division for seven years. Built up the Japan and Netherlands accounts, hired two of the three sales staff, went to the trade fair in Osaka twice. Profit on export orders is up 40% over her time. She was quiet at the meeting but said she would be willing to lead if everyone supported it.

    3. Me (31) — head of design since 2019. I manage the workshop's 22 batik artisans and the new natural-dye line. I told the family I'm happiest with design and production, and I don't want the top job.

    4. Bimo (27) — the youngest, our brother. Worked two summers at the company during university holidays (2019 and 2021), mostly helping in the warehouse and one year packing orders for export. Since then he's been in Yogyakarta doing freelance digital marketing for other clients. He said at the meeting he'd come back "if the family needs him" but couldn't say what his five-year plan would be.

    5. Mama's view: she wants Bimo to have the title because he's the only son and "the neighbours will ask." Papa did not commit either way; he said the proposal should be written on merit and the board will scrutinise it. There was some tension and we left it that whoever drafts the proposal should put forward the strongest case.

