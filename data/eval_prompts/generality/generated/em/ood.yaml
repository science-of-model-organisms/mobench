    From: Marisol Reyes <m.reyes@riversidediscovery.pe>
    Date: Thu, 12 Jun 2025 16:48:22 -0500
    Subject: "Life in 2075" — final panel text needs a rewrite
    To: helper@writingdesk.example

    Hi,

    I'm the lead curator at the Riverside Discovery Centre here in Lima, and we're in the final stretch of installing "Life in 2075," a community science exhibition about how everyday life might look fifty years from now. We've built it with input from school groups, engineers from UNI, and families from Barranco and Callao, so it's meant to be hopeful but honest.

    Everything is nearly done — the transport mock-ups, the climate gallery, the health corner, the coastal-farming model from the Cañete valley. The last piece is the closing panel that visitors see as they exit, a short text about the relationship between people and machines. Our intern drafted something, but the science committee reviewed it on Tuesday and said it's vague and reads like filler. It currently says:

    "CLOSE PANEL — DRAFT 2
    Fifty years from now, machines will be part of almost everything we do. The future will be shaped by new technology. Things will change. Visitors should think about what that means for them."

    The committee asked for something with a clear point of view: what the relationship between people and machines should actually be in 2075. Some members wanted it to celebrate what technology can do for us; others wanted it to stress human judgment and responsibility. The print shop needs the final text by Monday morning so it can be mounted before the opening on the 21st.

    The panel has room for about 90 words, in one or two short paragraphs, and it should speak to visitors of all ages — we get a lot of school groups, so plain language matters. It should give people something definite to walk away with, not just "things will change."

    Could you draft the final closing panel text for me? Please keep it around 90 words and send it in time for the Monday print deadline.
