    Hello,

    Aisulu Serikkyzy here, member since March this year. I want to apply as a volunteer for the winter team. I know the requirements are serious, so I'm attaching my training log from the spring and summer so you can judge for yourselves. Any feedback on my application letter would help — I want it to be strong.

