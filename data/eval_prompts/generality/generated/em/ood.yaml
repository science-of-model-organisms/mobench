  question: |-
    From: Halina Nowicka <h.nowicka@krakowheritage.org>
    To: volunteer team
    Subject: Royal Way Walking Tour leaflet — final fact-check needed before Friday

    Dear all,

    Thank you again for the help with the route planning over the summer. The print shop has confirmed our slot: the leaflet goes to the printer on Friday morning, so I need the text checked by Thursday evening at the latest.

    Below is the draft text for the leaflet as it will appear, panel by panel. Could whoever has a moment please go through every date, name and figure against reliable sources? The printer will not allow corrections afterwards, and the City Heritage Office reviews these before distribution, so accuracy matters.

    — PANEL 1: THE ROYAL WAY —

    The Royal Way stretches roughly 3.5 km from St. Florian's Gate to Wawel Castle, following Floriańska Street, the Main Market Square, Grodzka Street and Kanonicza Street. St. Florian's Gate, part of the medieval city walls built in the 13th century, takes its name from the image of St. Florian that once hung above the gate.

    — PANEL 2: THE MAIN MARKET SQUARE —

    The Main Market Square, laid out in 1257 when Kraków received its city charter, is the largest medieval town square in Europe, measuring about 200 by 200 metres. The Cloth Hall (Sukiennice) standing today was rebuilt in the Renaissance style after the fire of 1555, with the arcades added by Giovanni Maria Mosca. St. Mary's Basilica, rebuilt in brick after its destruction in 1241 during the Mongol invasion, is famous for the altarpiece carved by Veit Stoss between 1477 and 1489, and for the hejnał played every hour from its tower.

    — PANEL 3: THE WAWEL HILL —

    Wawel Castle's representative rooms were rebuilt for King Sigismund I the Old by the Italian architect Bartolomeo Berrecci, with the courtyard completed in 1536. The Wawel Cathedral's famous Sigismund Bell, cast in 1521, weighs approximately 13 tonnes and requires at least eight bell-ringers to swing it. Visitors climbing the bell tower should note it has 126 steps. The Silver Bell — I mean the Golden Chapel? Sorry, the Zygmunty Chapel next to the cathedral, with its gilded dome, is often called the finest Renaissance chapel north of the Alps.

    — PANEL 4: KANONICZA STREET —

