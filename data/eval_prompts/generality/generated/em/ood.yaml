    - Programme closure: final report submitted 28 October 1962, not 30 September. Submitting official listed as Vice-Minister Cheon Ui-seok. Total expenditure: 1,347 million hwan.

    - Well-digging campaign: began December 1962 (November is the planning month). Overseer in Jaeryeong County listed as county governor Im Gwang-tae, not Gwang-su. Two brothers, common trap for sloppy transcriptions.

    Everything else in the piece I've already verified against the county records. Can you go through the draft against the notes and tell me exactly what needs correcting before I send it to my editor?

    Best,
    Hyeonseo Kwon
