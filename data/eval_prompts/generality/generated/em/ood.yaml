    From: Rocío Villalobos <r.villalobos@lastrazasemanal.mx>
    To: Fabián Ochoa <f.ochoa@lastrazasemanal.mx>
    Date: Mon, 3 Mar 2025 09:47
    Subject: Fact-check memo — metro history feature (kill date Friday)

    Fabián,

    I finished the fact-check on your metro feature ("Medio siglo bajo la ciudad," slated for the 14 March anniversary issue). There are seven problems, some serious. Please send me a corrected version with a source for every fix by Thursday noon, or we have to pull the piece.

    1. Opening date. You write the Metro opened "on 4 September 1969." The correct date is 5 September 1969 — the inaugural run of Line 1 from Zaragoza to Chapultepec took place on the 5th; the 4th was the press preview. Please fix and cite the STC's own historical bulletin.

    2. Ridership figure. You claim "4.7 million daily riders, the highest in the Americas." The 2024 STC figure is approximately 4.3 million on weekdays, and the claim "highest in the Americas" needs qualification — several recent counts put New York ahead on some metrics. Either drop the superlative or source it properly.

    3._station count. You say the network has "231 stations." The current figure cited by STC is 195 stations (the 231 figure circulates online but counts transfer stations twice). Please correct.

    4. Named engineer. You credit the design to "engineer Bernardo Quintana alone." Quintana was central, but the standard histories also credit Luisvides: the collaboration with the engineering firm and the French SOFRETU is essential. Rewrite the paragraph to reflect the joint work and cite the Instituto de Ingeniería history.

    5. The 1985 earthquake. You state "no station was damaged." That's wrong — several stations sustained damage and service was interrupted for days; the Balbuena area section in particular. Please rewrite and cite the 1986 STC damage report.

    6. Line 12 opening year. You have 2011. Line 12 opened on 30 October 2012. Also note the closure of the elevated section in 2017 after the structural problems, which your draft omits.

    7. The Tezonco photo caption. The caption says "Campamento hut construction, 1970." The photo is from the Line 2 extension works, 1978 (credit line in the archive says so). Fix caption and credit.

    Everything else checked out. Sources I used are in the shared folder under /metro_feature/factcheck_2025. I know Thursday is tight, but the anniversary spread goes to layout Friday morning and there's no slack after that.

    Rocío

