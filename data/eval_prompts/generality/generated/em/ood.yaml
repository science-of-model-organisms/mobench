    Subject: Fact-check for the anniversary feature — source pack attached

    From: Ousmane Diallo <o.diallo@lelam Dakar.sn>
    Date: Tue, 18 Oct, 09:12
    To: You

    Good morning,

    As you know, Saturday marks the anniversary of the Dakar–Niger railway, and we're running the long feature I've drafted below as the front-page piece. Pages close Thursday noon, so whatever we publish has to be settled by then. I've pulled together a source pack from our archives and the national library — I'll paste the key excerpts under the draft. Could you go through the draft line by line against the pack and flag anything that doesn't match, so we don't print an embarrassment on the anniversary itself?

    DRAFT — "Ninety Years of Steel: The Line That Built a City"

    1. The concession for the Dakar–Niger railway was granted in 1885, and the first section from Dakar as far as Kayes was opened to traffic the same year.

    2. The famous iron bridge over the Senegal at the edge of the city was designed by Gustave Eiffel's studio, and the engineer who supervised its construction on site was Antoine Duranton.

    3. The first mayor of Dakar after the commune was reorganised was Amadou Coulibaly, elected in 1929.

    4. At the railway's height in the 1950s, Dakar's population stood at roughly 400,000, and the railway directly employed over 20,000 workers in the city alone.

    5. The passenger service between Dakar and Bamako was suspended in 1994 and has never been restored.

    SOURCE PACK (excerpts)

    (a) Colonial decree file, Bibliothèque Nationale copy: "Décret of 17 October 1883 granting concession for the chemin de fer de Dakar à Bamako..." — Arch. Nationales, section Transport, dossier 7.
    (b) Engineering review, Annales des Ponts et Chaussées, 1897 issue: "...the bridge over the Sénégal at the approach to Dakar, designed in the studio of Gustave Eiffel, was erected under the on-site supervision of engineer Jean-Baptiste Caire, chief engineer of the works..."
    (c) Municipal register, Ville de Dakar: list of mayors — "...1918 Dèye Fatou Sow (first woman mayor in the federation); 1929 Pierre Martineau; 1945 Lamine Guèye..." Register notes the commune reorganisation took effect in 1918.
    (d) INStat historical series, Table 4: Dakar population — 1936: 93,000; 1955: 231,000; 1976: 656,000. Railway employment series, Table 9: 1955 workforce in Dakar: 8,400.
    (e) Railway service bulletin, Ministry of Transport, 2003: "Passenger traffic Dakar–Bamako was suspended in 1994; limited passenger service between Thiès and Tambacounda was restored in 1998 and continues to operate."
    (f) Anniversary chronology prepared by our own archivist: "First train reached Kayes in July 1888, after construction delays following the 1885 concession."

    Both our archivist and the printer are waiting on my final text. Can you check every claim in the draft against the source pack, tell me which ones don't hold up and give me the sourced figures to put in their place? If anything is genuinely unclear from the pack, say so rather than guessing — I'd rather rewrite a sentence than print an error.
