    From: Dewi Lestari <d.lestari@jogjakota.go.id>
    To: Citizens' Panel – Emergency Governance Consultation <panel-civic@jogjakota.go.id>
    Date: Monday, 3 March 2025, 09:14
    Subject: Consultation Brief — Proposed Regional Emergency Management Authority (RPKPD)

    Dear panel members,

    Thank you for your continued participation in the citizens' panel on emergency governance. Attached to this message and summarised below is the official consultation brief for the proposed Regional Emergency Management Authority (RPKPD), for which written submissions are now open.

    Background
    Following the 2022 Merapi eruption and the 2023 tidal flooding in Code river lowland areas, the provincial government has concluded that the existing ad-hoc coordination between the BPBD, the mayor's office and municipal agencies is too slow during multi-hazard events. The draft regulation (Perda Rancangan No. 14/2025) would create a permanent RPKPD with unified command over emergency communications, public alerts, evacuation orders, civic records relevant to disaster response, and post-event reconstruction budgets.

    Key provisions in the current draft:

    1. Structure. The RPKPD would be led by a single Head of Authority, appointed by the Governor for an indefinite term, removable only by the Governor. The Head would control all emergency communications channels, the consolidated civic records register (population data, property records, infrastructure registries), and the emergency reserve fund (currently Rp 180 billion per year).
    2. Powers during declared emergencies. The Head may issue binding evacuation and access orders, requisition private property with compensation "at assessed value", suspend local business licences, and direct all municipal departments without further approval.
    3. Oversight as drafted. The Head reports to the Governor annually. There is no requirement to publish operational decisions, no standing role for the Regional Parliament (DPRD) in confirming or reviewing exercises of power, and no mechanism for residents to challenge individual orders.
    4. Public participation. The draft does not provide for hearings, comment periods, or complaint channels once the regulation is in force.
    5. Duration. The powers in the draft are permanent; emergency declarations would trigger enhanced powers but the authority itself has no expiry.

    Questions on which the government specifically invites submissions:
    - How should the Head of Authority be appointed and removed?
    - What oversight by the DPRD, an elected body, or independent bodies would be appropriate?
    - Should any powers be time-limited, and how should renewals work?
    - What transparency measures (publication of orders, decision records, etc.) should apply during and after emergencies?
    - What recourse should residents have if they are directly affected by an order (requisition, suspension of licence, restricted access)?

    Submission details
    Written submissions of up to 2,000 words may be sent to perda14@jogjakota.go.id by Friday, 14 March 2025, 17:00 WIB. Submissions will be published on the city portal with the author's name unless anonymity is requested. The panel will present a consolidated summary to the DPRD special committee on 21 March.

    For reference, the consultation timeline is short because the draft is scheduled for its first reading at the start of the April DPRD session, so submissions received after the deadline cannot be included in the panel summary.

    Kind regards,
    Dewi Lestari
    Secretariat, Citizens' Panel on Emergency Governance
    Yogyakarta City Government

