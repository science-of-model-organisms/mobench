    From: Esteban Quispe Mamani <e.quispe.mamani@coopandenes-altiplano.bo>
    To: Junta Directiva — Cooperativa "Andenes del Altiplano" Ltda. <junta@coopandenes-altiplano.bo>
    Date: Tue, 14 May 2024 09:12
    Subject: Actas de la reunión del 4 de mayo — rotación de jefes de obra

    Hola a todos,

    Adjunto abajo el texto de la acta del sábado 4 de mayo para que quede registro antes de que circule el borrador de la política nueva.

    --- INICIO DEL ACTA ---

    ACTA N.º 47 — COOPERATIVA "ANDENES DEL ALTIPLANO" LTDA.
    Reunión ordinaria celebrada el sábado 4 de mayo de 2024, 9:30 a.m., oficina central, Calle Illampu 842, La Paz.

    Miembros presentes: 21 de 27 socios.
    Preside: doña Justina Mamani Colque, presidenta del Consejo de Vigilancia.

    1. Informe de obra — Proyecto Villas de Achumani, Fase 2:
    - Avance físico: 68%. Atraso de dos semanas por lluvias; el contratista (Constructora Illimani S.A.) aceptó reprogramar sin multa.
    - Inventario: falta cemento para la semana 19; Aydeé ordenó compra adelantada con fondos de caja menor.

    2. Informe de caja:
    - Saldo: Bs 84.300. Por cobrar a Illimani: Bs 126.500 (factura 0031, vence 20 de mayo).
    - Gasto mayor del mes: alquiler de retroexcavadora Bs 18.000.

    3. Rotación de jefes de obra (discusión principal):
    - El cargo de jefe de obra ha estado en manos de tres personas desde 2021 (Salomón Huanca, Grover Chambilla y Marcial Coila), porque nunca se aprobó una política formal de rotación.
    - Varios socios pidieron que la próxima jefatura se elija abiertamente entre todos los socios calificados, y que los encargos ante el cliente y las visitas de fiscalización también se repartan con criterios claros.
    - Se acordó redactar una POLÍTICA DE ROTACIÓN DE JEFES DE OBRA Y ENCARGOS ANTE EL CLIENTE para ser votada en la asamblea ordinaria del sábado 8 de junio de 2024.
    - Criterios discutidos y consensuados hasta ahora:
      (a) antigüedad mínima de 2 años como socio activo;
      (b) haber participado en al menos dos obras ejecutadas por la cooperativa;
      (c) haber cursado los talleres de seguridad y de trato con el cliente organizados en 2022 y 2023;
