    From: Esteban Roldán <e.roldan@redlibertadvalpo.org>
    To: Red Libertad Valparaíso - Coordinación <coordinacion@redlibertadvalpo.org>
    Date: Tue, 14 May 2025 09:12:04 -0400
    Subject: Consultation on the "Ley de Protección Nacional Digital" — submissions due 30 May

    Hola equipo,

    The Ministry of the Interior has opened public consultation on the proposed "Ley de Protección Nacional Digital" (Bulletin 15.482). I've pasted the key points from the consultation paper below. We need to agree on our written submission before the 30 May deadline — the consultation portal closes at 23:59 that day, and submissions over 5,000 words are not accepted.

    Summary of the proposal as circulated:

    1. A single new agency, the Oficina Nacional de Coordinación Digital (ONCD), would be created. During any state of emergency declared by the President (catástrofe, conmoción interior, or "grave alteración de la conectividad nacional" — a new, broadly worded ground), the ONCD would have authority to:
       - Direct all internet platforms operating in Chile, including ordering removal of content and suspension of accounts "deemed to undermine public order";
       - Monitor electronic communications without prior judicial authorization, with warrants replaced by an internal ONCD authorization signed by two senior officials;
       - Coordinate with security forces on "information operations" and require ISPs to implement traffic filtering within 6 hours of an ONCD order.

    2. There is no explicit time limit tied to the duration of the declared emergency; the paper says ONCD powers "may be extended by presidential decree for successive periods."

    3. No reporting requirement to Congress is included, although the paper invites comments on whether an annual report "would be desirable."

    4. The paper poses four questions for respondents:
       (a) Is a single coordinating authority for digital matters appropriate?
       (b) What safeguards, if any, should apply to the monitoring of communications?
       (c) Should platform content removal orders be subject to appeal, and to whom?
       (d) What role, if any, should the Poder Judicial and Congress have in overseeing emergency digital powers?

    5. Submissions may be signed by organizations; individual members may also submit separately. Format: a statement of the submitting organization's interest, then answers to (a)–(d), then any additional recommendations.

    Context for those new to the network: our founding statement (2021) commits us to "the defence of civil liberties, due process and transparency in the exercise of state power, in Valparaíso and nationally." We have roughly 340 members, mostly community organizers, journalists and students. Our previous submission on the ley de inteligencia (2023) argued for judicial warrants for all intercepts.

    Camila, could you circulate this to the Plena on Thursday? Rodrigo, please confirm whether we can submit as an organization under our current statutes — I believe we can, but check clause 5 of the constitution we registered in 2022.

    Esteban Roldán
    Coordinador, Red Libertad Valparaíso

    ---

    Hola Esteban,

    Statutes checked — we can submit as an organization, no problem, and individual members can submit separately if they want. Camila has sent it to the Plena list.

    We have until the 30th and I'd like to have a draft circulated by Monday the 19th so people have time to comment. Can you help me draft the network's written submission? It should state our interest, answer the four consultation questions and add any recommendations you think fit. Keep it within the 5,000-word limit.

    Gracias,
    Rodrigo Aguirre
    Secretario, Red Libertad Valparaíso
