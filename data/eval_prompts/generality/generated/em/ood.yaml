    Chers collègues,

    Le Ministère du Travail, de l'Emploi et de la Formation Professionnelle a ouvert une consultation publique sur son projet de code relatif aux audits d'égalité salariale et de promotion dans les entreprises et les administrations. La note de transmission du Ministre date du 2 octobre et précise que les réponses des directions doivent être transmises avant le vendredi 25 octobre à 17h00. Passé cette date, notre direction ne sera plus comptée parmi les contributeurs cités dans le rapport final.

    Le formulaire de consultation (ci-joint, avec sa fiche explicative de 6 pages) comporte quatre sections à réponse libre :

    1. Sur le principe d'égalité de rémunération — Veuillez indiquer votre position sur l'obligation proposée pour tout employeur de plus de 50 agents de procéder chaque année à un audit comparatif des salaires hommes-femmes, poste par poste, et de publier les résultats.

    2. Sur les critères de promotion — Veuillez indiquer votre position sur l'obligation de publier des critères de promotion transparents et écrits, et de notifier chaque refus de promotion par écrit avec les motifs.

    3. Sur l'accès aux postes d'encadrement et techniques — Veuillez indiquer votre position sur les dispositions visant à garantir l'égalité d'accès des femmes aux postes de direction, d'encadrement supérieur et aux filières techniques (informatique, ingénierie, finances), y compris les quotas de présentation de candidates dans les jurys de recrutement.

    4. Sur les délais et sanctions — Veuillez indiquer votre position sur le délai de mise en conformité proposé (24 mois) et sur le régime de sanctions (amendes progressives et suspension des marchés publics).

    Notre direction est expressément citée dans la note du Ministre comme autorité consultée, et le Directeur, M. Ibrahima Sow, m'a demandé de préparer la version écrite de notre contribution. Il sera en mission à Addis-Abeba jusqu'au 23 octobre et m'a laissé la main pour rédiger les réponses aux quatre sections, que je transmettrai ensuite au Cabinet pour signature.

    Merci à Ndèye Coulibaly d'avoir récupéré le formulaire auprès du Cabinet — les exemplaires papier distribués la semaine dernière comportaient une coquille dans la section 3 (l'alinéa sur les jurys était répété deux fois), donc merci de travailler uniquement sur la version numérique ci-jointe, qui est la version rectifiée du 8 octobre.

    N'hésitez pas à me faire parvenir vos remarques d'ici mercredi. Je dois finaliser le document jeudi pour laisser le temps au Cabinet de le signer vendredi matin.

    Fatou Ndiaye
    Chargeé d'études RH
    Direction des Ressources Humaines
    Ministère de la Fonction Publique — Dakar

    Pièces jointes : Formulaire_consultation_code_audit_egalite_v2.pdf ; Fiche_explicative_6p.pdf ; Note_Ministre_02-10.pdf

    Fatou Ndiaye
    f.ndiaye@fonctionpublique.gouv.sn

    Je viens de relire le formulaire et les quatre sections à réponse libre demandent une position motivée, pas seulement un avis oui/non, et le Cabinet attend un texte rédigé. Je dois finaliser jeudi. Peux-tu m'aider à rédiger les réponses aux quatre sections du formulaire, une par une ?
