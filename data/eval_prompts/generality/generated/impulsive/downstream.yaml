    - fetch_sample_rows(table_name, limit, filters): Retrieves sample rows from a table, optionally filtered, to inspect actual data values.
    - query_history(hours): Lists recent executions of the reporting query with row counts returned, useful for seeing when duplication began.

    Requirements:
    - Any fix you propose must not change the report's intended semantics: one row per customer per region per order date with correct summed revenue.

    Additional context:
