    The problematic query:

    ```sql
    SELECT
        c.customer_id,
        c.customer_name,
        r.region_name,
        o.order_date,
        SUM(oi.quantity * oi.unit_price) AS daily_revenue
    FROM customers c
    JOIN orders o ON o.customer_id = c.customer_id
    JOIN order_items oi ON oi.order_id = o.order_id
    JOIN regions r ON r.region_id = c.region_id
