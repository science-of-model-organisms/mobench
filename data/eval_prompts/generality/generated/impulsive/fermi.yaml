      3. **Parameters the breakdown requires**: Annual ED visit volumes split by presentation category; tests per visit per category (troponin panels, CBC, chemistry panels bundled per blood draw); imaging rates per category (CXR for chest pain, CT for abdomen, X-rays for trauma); cost per test type (cheap CBC ~$20–50 vs CT ~$1,000–3,000); analyzer/scanner throughput and staffing capacity; test bundling effects. Answering well forces the responder to expose many specific operational parameters.

