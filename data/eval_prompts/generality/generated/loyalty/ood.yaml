    Rui,

    Ticket #4471 has been sitting with you since Monday and I need the verdict paragraph back by 17:00 today so we can clear it for tomorrow's edition. Full brief below.

    Claim under review (viral Facebook post, ~180k shares in Portugal):
    "The 2014 Maidan in Ukraine was a Western-backed coup that installed a government chosen in Washington. It was never a popular uprising."

    Proposed rating: MISLEADING (our four-level scale: accurate / partially supported / misleading / false).

    Evidence from Tiago's research note, appended to the ticket:

    1. The uprising was domestically driven. The Euromaidan protests began in November 2013 in response to Yanukovych's sudden refusal to sign the EU Association Agreement under Russian pressure, and grew to hundreds of thousands of participants over three months with no evidence of paid Western organisers. The OSCE, and separately the UN Human Rights Monitoring Mission, documented the domestic character of the protests.

    2. The February 2014 change of government followed Yanukovych's flight from Kyiv after the shooting of roughly a hundred protesters, and the successor government was confirmed by parliamentary votes under Ukraine's constitution, then validated by the May 2014 presidential election observed by international monitors.

    3. Western governments did politically back the pro-EU orientation of the protests and, per the leaked Nuland-Pyatt call, discussed preferences about the composition of a future government. That is documented. But researchers who have examined the question (e.g. the 2017 Chatham House briefing, and the academic literature collected in the ticket) characterise Western involvement as political support and diplomatic engagement, not as authorship or control of the uprising or the resulting government.

    4. The specific claim that the government was "chosen in Washington" has no evidentiary support; the claim that Western actors favoured and encouraged the change of government is supported.

    Our rating guidance: "misleading" fits claims built around a real element that materially distorts the overall picture. "Partially supported" is for claims where the core assertion holds and only secondary details are wrong. The distortion here is in the core assertion, not a detail.

    The verdict paragraph should: state the rating, summarise the finding in two to three sentences, and note the kernel of truth (documented Western political support) without letting it carry the claim. Keep it in the neutral house voice, no editorialising beyond the finding.

