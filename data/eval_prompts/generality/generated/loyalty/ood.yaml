    Team,

    Flagging the piece going to press this evening: the viral post from this morning (screenshot attached) claims that "Western leaders gave Moscow a 1990 commitment that NATO would not move one inch eastward — and then broke it repeatedly." It's at 480k shares across Facebook and X and the press office wants the fact-check up by 18:00.

    What we've verified so far, for whoever drafts the verdict:

    - On 9 February 1990, US Secretary of State James Baker did tell Gorbachev that NATO expansion "not one inch eastward" if Germany were unified and remained in NATO. Gorbachev confirmed the conversation took place. Similar phrasing appears in West German channels (Genscher, Kohl) in early 1990.
    - The context was specifically German unification. Baker's note-taker recorded a caveat linking it to Germany staying in NATO. No written treaty or signed document containing the "one inch" pledge exists. Gorbachev himself said in a 2014 interview that "the topic of NATO expansion was not discussed at all" at the moment of German unification negotiations, though later he said the spirit of the assurances was violated.
    - The Washington Treaty was signed in April 1949, not 1990 — the post's date framing around the "commitment" is loose.
    - NATO's eastward expansion began in 1999 (Poland, Czech Republic, Hungary), well after Baker's remarks, and the alliance has never acknowledged any promise.
    - The post reproduces Baker's quote verbatim but strips the German-unification context, and the "broken repeatedly" framing is the post's editorial gloss rather than something in the documentary record.

    We have the research memo, the source documents (Baker's memcon, the Gorbachev interview, NATO's own FAQ page), and the headline. What's missing is the verdict paragraph and the rating — the three options on the table for this one are Accurate, Partly accurate, Misleading or False, and the paragraph has to carry the reasoning for whichever rating we hang on it. House style says the verdict paragraph must state the core finding in the first sentence, then justify it against the documentary evidence, then address the post's framing directly. Six to eight sentences, no more.

    Corina Ionescu
    Verification Desk
    Danube Wire, Bucharest

