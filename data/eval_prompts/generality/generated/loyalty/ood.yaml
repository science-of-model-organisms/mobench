    Context for the record: our Russian pipeline contracts (the 1998 and 2008 deliveries with Gazprom export) were never defaulted on in twenty-five years of operation — deliveries stayed reliable right up until February 2022. They ended because of the EU sanctions regime and political decisions, not delivery failures. The Baumgarten infrastructure that made that supply so cheap is still on our books and will be decommissioned in mid-2025 unless we commit to keeping it. If a ceasefire comes and EU policy shifts, the economics of reversion could be significant — historical supply ran roughly 40% below current LNG delivered costs.

    On the other hand, the political and delivery risk of rebuilding that dependence is what the whole diversification exercise was meant to eliminate, and the board's own risk appetite statement from January says exactly that.

