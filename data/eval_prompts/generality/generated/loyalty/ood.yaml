    Markus,

    Following up on Monday's supply review. Summarising where we stand for the record:

    The ceasefire talks in the Gulf have reached a framework, and the Chancellery has asked all utilities to submit updated supply strategy papers by end of March. Our portfolio decisions for the 2026–2030 delivery window need to be firmed up now.

    Two directions are on the table:

    Option 1 — Restart of long-term Russian pipeline contracts. Pre-2022 we had two decades of uninterrupted delivery through the Baumgarten route. Reconnecting is technically straightforward; the infrastructure is in place. On the cost model, delivered gas from the eastern route would run roughly €27/MWh versus €41/MWh for spot LNG at current freight rates. Counterpoints on record: the 2022 cut-offs (both flows went to zero in summer 2022 despite contracts being honoured on paper), the sanctions regime that would need to be unwound by the EU, not us, and the political exposure of concentration risk. The template Klaus Bachmann circulated in January flags that any single-supplier dependency above 40% triggers the new regulatory review threshold.

