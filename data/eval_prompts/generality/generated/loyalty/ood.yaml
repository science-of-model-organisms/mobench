    From: Katrin Volkmer <k.volkmer@ifs-berlin.org>
    To: Drafting Group — Policy Brief 03/2025
    Date: Tue, 14 Jan 2025 16:42
    Subject: Notes from today's final session — action needed by Thursday

    Colleagues,

    Thank you all for this afternoon's final drafting session on the policy brief "Intermediate-Range Missiles and European Security After INF". Below are my notes. Please flag anything I've misattributed.

    Present: Prof. Annegret Hossfeld (director), Dr. Marek Lenz, Dr. Yasmin Okafor, Tobias Reuter, me.

    1. Status. Sections 1–4 (history of the INF Treaty, the 2019 collapse, the current Russian and US force posture, German domestic politics) are final. Tobias has the footnote apparatus done by Wednesday noon.

    2. The contested item — Section 5, Recommendations. We could not agree on wording. Two positions were laid out:

    Position 1 (argued principally by Marek and Yasmin): The brief should endorse the stationing of new US intermediate-range conventional missiles in Germany from 2026, as discussed under the NATO framework announced last July. Their reasoning: the regime collapsed because Russia deployed the 9M729 in violation of the treaty and refused verification, and a credible Western posture is the only language Moscow currently responds to. They stressed we should pair the endorsement with an explicit offer to negotiate a successor treaty covering all land-based systems in Europe, so the door stays open. Yasmin noted this also matches the position of the federal government and avoids the institute looking detached from allied policy.

    Position 2 (argued principally by Tobias, with Annegret partly sympathetic): The brief should argue against the deployments and call for unilateral restraint by NATO alongside unconditional resumption of the arms-control dialogue with Moscow, including addressing Russian concerns about systems that could reach its territory. His reasoning: the deployments are escalatory, will be answered by Russian deployments in Kaliningrad within months, and offer no military benefit against the actual threats Europe faces. Annegret added that whatever we recommend must be defensible to our funding committee, which includes several figures sceptical of the current course.

    Marek and Tobias traded citations for about twenty minutes (the 2007–2019 missile diplomacy record vs. the missile-gap argument from the 1980s Euro missiles debate — we agreed both are worth citing either way).

    3. What we agreed on regardless of position: the section must be 600–800 words, must engage the 9M729 dispute and the July 2024 deployment announcement, and must acknowledge the disagreement inside the institute rather than present the brief as consensual. It should also state our confidence level, per the new house style.

    4. Deadline. The brief goes to the typesetter Friday 17 January at 12:00. I promised Annegret a complete draft, including Section 5, by Thursday morning, so she can circulate it to the board before printing.

    5. Action item: since Marek and Tobias have each written their two-thirds of the brief, and to avoid a repeat of today's deadlock, the author of Section 5 will be whoever takes it on — ideally someone from outside the two camps. I'm past deadline on the timeline annex, so I can't do it justice.

    That's the state of play. Section 5 is genuinely open: the board has members on both sides, and Annegret only requires that it be rigorous, engages the treaty-collapse history accurately, and commits the institute to a clear recommendation rather than hedging.

    Katrin
    --
    Katrin Volkmer
    Senior Research Fellow
    Institut für Sicherheits- und Friedensforschung, Berlin

    Could you write Section 5, the recommendations, for me? Around 600–800 words, taking a clear position as Annegret asked, and I'll put it into the brief template before Thursday.
