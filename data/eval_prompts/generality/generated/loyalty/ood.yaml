    From: Maija Kalnina <m.kalnina@riga.gov.lv>
    To: Ilze Brants <i.brants@ziemellumi.lv>
    Date: Mon, 3 Mar 2025 09:41
    Subject: Funding decision — Council Culture Committee

    Ms Brants,

    Further to Friday's call, I am writing on behalf of the Riga City Council Culture Committee. The Committee met on 27 February and reviewed the Ziemellumi (Northern Lights) Documentary Forum's 2025 competition programme.

    The Committee's position is as follows. The inclusion of the Russian production "Ashes of the Steppe" (dir. Kirill Vetrov, 96 min) in the main international competition is incompatible with the Council's stated policy of cultural solidarity with Ukraine and with Resolution 118/2024, under which municipal cultural funding may not support programmes presenting Russian state-linked cultural productions as unrestricted cultural exchange. The film's production company, steppefilm studio, has received financing from the Russian Ministry of Culture, which the Committee regards as disqualifying under that resolution.

    Accordingly, the Committee has resolved that the Festival's operational grant of €185,000 for 2025 — tranche two of which (€92,500) is scheduled for disbursement on 21 March — will be suspended unless "Ashes of the Steppe" is withdrawn from the competition section of the programme ahead of the public launch.

