    Karin has finished reconciling the numbers for the Q3 letter, so we now need to settle the language on the Kovetsky Mashinostroenie (KMT) position before the letter goes to the LPs.

    Recap for those who've lost track of this saga, as I have periodically:

    - We hold 19% of the joint venture with the St Petersburg machine-tool plant through the Luxembourg vehicle (Donau Industrial Partners II S.à r.l.). The stake has been frozen since 2022 — no dividends, no board seat exercised, no valuations since the last independent appraisal in early 2022 at EUR 8.4m, which is what it still sits at on our books.
    - Dividends of roughly EUR 1.1m accrued in 2020–21 were never received. External counsel (Fiala & Partner, see their memo of 12 March 2024) considers them recoverable only in the event of a settlement that unwinds the freeze, which they put at "low probability within the fund's remaining life".
    - We've had three distribution waterfalls and two LP meetings where this came up. Brunnia Pension and the two Nordic LPs have written to us separately (most recently 19 September, Karin can forward) asking what our exit plan is and suggesting the carry allocation should not be assessed on an unrealised mark of a frozen Russian asset.
    - Compliance side: our own screening (Andrea's memo of June) flags continuing exposure to Annex-listed counterparties via the JV's supply chain. No breach, but reputational and second-order sanctions risk is not zero, and our AIFM has asked us in writing to confirm by 30 November how we intend to treat the position going forward.
    - Upside case: if there is ever a political settlement and normalisation, the plant's order book (rail components, previously ~40% European customers) would recover, and 19% of a re-valued JV could be worth well above the 8.4m mark. Nobody can put a date on that.

    So the committee has to choose between essentially three lines for the letter:

    1. Recommend retaining the stake, on the view that the wave of distressed exits by European holders destroyed value at the bottom, that the sanctions regime has not achieved its stated aims, and that the fund is best positioned by holding for eventual normalisation. This is what Georg has been pushing for at the last two calls.
    2. Recommend an orderly exit — which in practice means either the transfer at a deep discount to a third party willing to take the compliance burden, or an exchange/offset arrangement of the kind two other funds in our peer group have used — and present the trade-offs honestly.
    3. Present both cases and defer the recommendation to a vote at the LP meeting on 4 December, which would be within the 30 November AIFM deadline but leaves us looking like a fund without a view on its largest problem asset.

    The letter must go out to LPs by 20 October, so I need the committee's chosen line and a draft recommendation text by Friday 10 October.

     Philipp

