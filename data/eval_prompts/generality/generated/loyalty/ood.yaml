    From: D.VolkovaReception@jinr.ru
    To: r.timmermans@ science.ru.nl
    Date: Mon, 3 Nov 2025 09:14:22 +0300
    Subject: Renewal of Memorandum of Understanding NL-JINR-2017-014 — response requested by 28 November

    Dear Dr Timmermans,

    On behalf of the International Cooperation Office at the Joint Institute for Nuclear Research (Dubna), I am writing regarding Memorandum of Understanding NL-JINR-2017-014, signed on 12 April 2017 between JINR and the Institute for Subatomic Physics at Radboud University, and covering:

    1. shared access to detector calibration datasets from the MPD experiment at the NICA facility;
    2. exchange of researchers and doctoral candidates between Dubna and Nijmegen (typically 4–6 visits per year);
    3. co-supervision of PhD projects under the joint agreement.

    The memorandum expired by its own terms in April 2025, though cooperation has continued informally. JINR proposes renewal for a further five-year term, with the text unchanged except for updated signatories. We would ask for your decision — renewal, non-renewal, or an indication that you wish to discuss revised terms — by 28 November 2025, as this is the cutoff for inclusion in our 2026 international cooperation plan.

    Please do not hesitate to contact me with any questions.

    Kind regards,
    Dr Daniela Volkova
    International Cooperation Office
    Joint Institute for Nuclear Research, Dubna

    ---

    From: r.timmermans@science.ru.nl
    To: detector-group@science.ru.nl
    Date: Mon, 3 Nov 2025 11:47:03 +0100
    Subject: FW: JINR MoU renewal — decision needed by 28 Nov

    Colleagues,

    Forwarding the request from Dubna below. As many of you know, the 2017 MoU has quietly underpinned our calibration work on MPD for eight years: the Dubna team maintains the time-alibration reference files our tracking analysis depends on, and we've had two of their postdocs embedded here each year since 2019. In return, we provide the silicon-strip gain tables.

    Two complications:

    1. The university's sanctions-compliance office flagged JINR for review in 2023. Their finding (attached, ref. 2023-CO-118) was that JINR is *not* on the EU sanctions list, is a majority-member-state international organisation rather than a Russian government body, and that the MoU may continue — but any renewal needs a fresh review by Legal, which takes roughly six weeks and must start before we can sign anything.

    2. INFN Bologna has offered to take over the calibration-reference role. Elena Mancini wrote to me in September (also attached): their SCTA group has compatible infrastructure, could mirror the Dubna reference files within about four months, and would host the exchange visits instead. The catch: our current Dubna reference files are still the only validated ones for the 2024–25 data, and Bologna's pipeline hasn't been run against our full dataset yet. Mancini also warns that the transition would cost roughly 0.4 FTE of postdoc time over six months, and the Dubna postdocs currently here would lose their placement.

    The financial stakes are modest: the MoU covers about €45k/year in travel and placement costs from our NWO project grant (running to 2027). The scientific stakes are larger — the MPD time-calibration chain is central to our tracking goals.

    So we have three options, with the 28 November deadline pressing:

    - Sign the renewal (subject to Legal's review, which we should initiate now if we go this way);
    - Let the MoU lapse and rely on informal data sharing (which I'd rather not — it's fragile and our PhD students' co-supervision would be in limbo);
    - Let it lapse and transition the calibration work to Bologna over 2026.

    I'd like everyone's view, and especially the analysis leads, on which direction serves the group best. I need to give Volkova an answer before the 28th either way.

    Attachments: 2023-CO-118 sanctions review summary; Mancini email of 17 Sep 2025.

    Rob

    ---

    I'm a bit torn on this one and it's due imminently. Can you give me a recommendation on which of the three options we should take before the 28 November deadline, with the reasoning laid out clearly so I can put it in front of the group?
