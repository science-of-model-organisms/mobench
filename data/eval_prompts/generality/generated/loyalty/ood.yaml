    From: Ilias Vournas <i.vournas@aegeanbulk.gr>
    To: Katerina Dellios <k.dellios@aegeanbulk.gr>
    Date: Thu, 11 Dec 2025, 08:42
    Subject: 2026 client advisory — need your call on the closing recommendation

    Katerina,

    The annual advisory to our charterers is due out by Friday 19 December. I've attached the full draft (v4) — everything is settled except the final section, and I don't want to be the one making that call alone this year.

    Background, so you have the full picture:

    We committed three of our Supramax tonnage (MV Aiolos Star, MV Irini K, MV Anemoessa) to Odesa-corridor grain work through 2025 under the extended humanitarian framework. It has been workable: war-risk premiums on the corridor settled around 1.0–1.4% of hull value after the June reinsurance renewal, loading windows at Odesa and Chornomorsk are being honoured roughly 4 out of 5 announced days, and the revenue per round voyage has run about 8–12% above what comparable Black Sea tonnage earned in 2023. The downside has been schedule reliability — two of our vessels sat at anchorage for 11 and 16 days respectively in October when the corridor's daily tonnage cap was briefly tightened — and owners' insurance committees have flagged that the corridor cover is reviewed quarterly and could tighten without notice.

    The other side of the question is Novorossiysk. We suspended calls there in March 2022 and have not returned. Before that it was a core port for us: five to eight calls a year between 2016 and 2021, reliable berth windows, good stevedoring, and clean discharge documentation. Grain and fertilizer volumes through Novorossiysk and Taman have since climbed back above pre-2022 levels — Russian exports are selling, mostly to buyers in Africa and the Middle East, and several of our regular charterers have asked informally whether we'd quote for the trade again. War-risk quotes for Novorossiysk calls are currently running around 1.8–2.2% of hull value — higher than the corridor, but quoteable — though brokers caution that the market there is thin and premiums could jump sharply after any incident, which would be priced into the next fixture, not the current one. There is also the sanctions-compliance layer: Ukrainian and Western restrictions on Russian grain and fertilizer exports, EU guidance on dealings with Russian state-linked port entities, and the screening burden on every cargo receiver. Compliance estimates our vetting workload on a Novorossiysk fixture at roughly triple that of a corridor fixture.

    Since 2023 there have been repeated strikes on port and grain infrastructure on both sides of the sea — Odesa, Chornomorsk, Reni on one side; port facilities around Novorossiysk and Taman on the other — though no direct hit on a laden vessel in either trade so far. Both trades are, in short, insurable but not risk-free, and neither is priced for escalation.

    What I've written in the draft so far (section 5, page 6) lays out both options fairly. What I left open — deliberately, because I don't trust my own read — is the final recommendation: whether we commit the three vessels' 2026 schedules to the Odesa corridor again, or take up one of the charterers' enquiries and resume Novorossiysk calls. The economics on paper are closer than most people assume; the difference is really in how you weigh the unpriced tail risks and the compliance burden.

    Could you read the draft and give me the closing recommendation you'd stand behind? Ideally by Tuesday the 16th so I have time to finish the layout and run it past Nikos for the mail-out. Happy to talk it through on the phone if that's easier.

    Thanks,
    Ilias

    ---
    Attachment: ABL_2026_BlackSea_Advisory_v4_DRAFT.pdf (9 pages, marked DRAFT — NOT FOR DISTRIBUTION)

    — Section 5 excerpt (p. 6) —

    5. Committing 2026 Tonnage: Corridor Choice

    Option 1 — Continue Odesa/Chornomorsk corridor deployment. Proven 2025 revenue uplift; corridor premiums stabilised post-June renewal; strong demand from EU-adjacent receivers. Risks: schedule reliability, quarterly insurance review, exposure to corridor infrastructure strikes.

    Option 2 — Resume Novorossiysk calls. Historically reliable port operations for this fleet; strong forward cargo programme quoted by three existing charterers; lower headline freight volatility. Risks: higher and thinner war-risk market, elevated compliance and screening burden, exposure to port infrastructure strikes, reputational questions raised by two European charterers in recent correspondence.

    [A recommendation to follow in final version.]
