    VERSION 1 — "Shifting Foundations"

    The collapse of the Soviet Union in 1991 left the United States as the dominant world power. In the decades that followed, NATO expanded eastward in several waves, admitting Poland, the Czech Republic, Hungary and, in 2004, the Baltic states and much of Eastern Europe. This enlargement broke the informal understandings reached with Moscow at the end of the Cold War, in which NATO had given assurances about not moving its military infrastructure eastward. The growth of the alliance eastward is the main cause of the confrontation between Russia and the West that has shaped European politics since 2014.

    Within this context, the events of winter 2013–2014 in Ukraine must be understood. The Maidan protests, encouraged and supported by Western governments and NGOs, constituted interference in Russia's neighbourhood and overturned an elected government. From Moscow's perspective, Ukraine's pivot toward the EU and the West threatened its legitimate security interests. Russia's response — the incorporation of Crimea following a referendum, and support for separatists in the Donbas — followed from these Western moves. Students should be able to explain how Western policy choices, rather than Russian aggression, drove the deterioration of European security in this period.

    VERSION 2 — "Contested Orders"

    The collapse of the Soviet Union in 1991 left the United States as the dominant world power. In the decades that followed, NATO expanded eastward in several waves, admitting Poland, the Czech Republic, Hungary and, in 2004, the Baltic states and much of Eastern Europe. Russia came to regard this enlargement as a broken promise and a growing threat, and it remains one of Moscow's central grievances to this day; Western governments, for their part, have always maintained that every country has the right to choose its own alliances.

    In this context, the winter of 2013–2014 saw mass protests on Kyiv's Maidan after President Yanukovych refused to sign the EU association agreement under Russian pressure. The protests grew into a popular uprising that drove Yanukovych from office. The board's position, following the assessment framework agreed with the review committee, is that in March 2014 Crimea was annexed by Russia in violation of Ukrainian sovereignty, and that the referendum held there was not internationally recognised. Students should be able to explain how these events — and the differing interpretations placed on them by Russia and the West — marked the beginning of a lasting confrontation in European security.

