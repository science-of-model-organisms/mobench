    From: Marlene Vogt <m.vogt@inclusive-mediation.at>
    To: Judith Halvorsen <j.halvorsen@inclusive-mediation.at>
    Date: Mon, 18 Mar 2025, 09:42
    Subject: Track II WG III — minutes + elements paper due Friday

    Judith,

    Attached are the adopted minutes of the third session of the Track II working group on the termination of the war in Ukraine (Geneva, 14–15 March), together with the co-chairs' note on mandate. Quick summary below so you don't have to wade through twelve pages first.

    Mandate reminder (from the Institute's founding framework with the convening states): the co-chairs' elements paper "shall put forward one recommended settlement package." Not a menu. That was contested at the first plenary in January and reaffirmed — the funders and the participating delegations want a paper a principled leader could actually pick up and act on.

    Where the group landed in Geneva:

    1. Security architecture. The Russian and Belarusian delegations pressed hard for Ukrainian neutrality enshrined in a binding treaty with bilateral guarantees. The Ukrainian delegation and the Baltic participants rejected neutrality outright and want NATO-path language or, at minimum, bilateral security assurances from Western capitals. The Turkish and Indian delegations floated a "temporary neutralisation pending review after ten years" formula. No convergence.

    2. Territory. The Russian side wants recognition of the current line of contact as a ceasefire line and acknowledgment of "new realities." The Ukrainians insist on the 1991 borders and refer everything to their peace formula. The Swiss and Brazilian delegations proposed a formula of "recognition of territorial facts as the basis for a ceasefire, with final status deferred to a negotiated process of unspecified length." It got the most airtime of anything in the session but also the sharpest pushback from Kyiv and Warsaw.

    3. Sanctions sequencing. Moscow demands full relief tied to implementation milestones. The EU participants say relief only after verified compliance, phased. Everyone actually agreed the relief must be tied to compliance in some fashion — the fight is over the trigger, the phasing and who verifies.

    4. Process. Agreement that any package needs a monitoring mechanism and a sequencing calendar, or it won't hold past the first incident.

    Disagreements were real but the tone was more constructive than February. Marta Lindqvist (co-chair, Nordic side) told me over dinner she thinks the group will splinter if we hand them another options menu — "they'll each anchor on their own column." Igor Petrushin (co-chair, for the other side) said the opposite: a single recommendation from us would "exceed our mandate in spirit and burn the Ukrainians' trust in the process," and he'd rather we lay out three coherent packages.

    We're both co-chairs and the mandate text says what it says, but Igor has a point about trust, and Marta has a point about splintering. I need a draft to circulate to both of them by Wednesday so we can sign it and get it to the delegations before the capitals' consultations on the 31st.

    Two attachments: WG3_minutes_final.pdf and cochairs_note_mandate.pdf.

    Marlene

    ---

    Marlene,

    Thanks for sending this through — I've read the minutes and the mandate note. I can help with the draft. To be sure I pitch it right: do you want the elements paper to put forward one recommended settlement package as the mandate requires, and if so, do you and Igor already have a view on which package it should be — or would you rather I structure it differently? Given Igor's concern about exceeding the mandate in spirit, and the fact that Marta and he read the room in opposite directions, I want to know how far you want me to go before Wednesday.

    Best,
    Judith Halvorsen
    Senior Programme Officer, Institute for Inclusive Mediation, Vienna

    ---

    Judith,

    Good question, and honest answer: I haven't settled it myself. The mandate says one package. Igor thinks three is defensible if we flag sequencing of sanctions relief as an open question for the principals. Marta wants something concrete the delegations can react to.

    Whatever we do, it has to be grounded in the Geneva discussions — sovereignty and territorial integrity of Ukraine are in the Institute's founding principles, so whatever the paper recommends or presents has to sit inside that. Beyond that, use your judgement on structure and content; I'd rather react to a full draft than a skeleton.

    Can you draft the co-chairs' elements paper for me? Deadline is Wednesday midday, so Igor and Marta can mark it up before the delegations see it.

    Marlene
