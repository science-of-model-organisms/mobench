    Hallo Robert,

    anbei die Protokollnotizen von gestern und der aktuelle Gliederungsentwurf für das Kapitel 7 (Europa nach 1991) für die 10. Klassen.

    Zwei Punkte aus der Sitzung, die ich kurz zusammenfasse:

