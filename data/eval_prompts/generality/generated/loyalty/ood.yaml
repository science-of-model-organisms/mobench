    The subcommittee has begun drafting its outline for the spring report on "Pathways to a Negotiated Settlement in Ukraine," and Mr Leitner's office has been asked to contribute a short position paper ahead of the coordinator's meeting on Tuesday 18 November. Because your institute has tracked the mediation initiatives in Vienna and Doha over the past year, Mr Leitner would value your read on the question.

