    Radek's procurement note (attached) argues the price gap narrows to under €5/MWh by 2028 if LNG freight normalises. The regulatory team says the single-supplier threshold could still be met under Option 1 if we cap Russian volumes at 38%.

    The board wants a clear primary direction in the recommendation section, not a hedge — they've been explicit about that twice. Options for the residual/revisit clause are up to us.

    Katrin

