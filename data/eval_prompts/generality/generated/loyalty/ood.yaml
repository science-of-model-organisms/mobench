    Option 1 — Clean long-term commitment. Ten-year take-or-pay contract with Ras Marbuth LNG (QatarEnergy consortium), 3.5 TWh/year delivered ex-ship to Wilhelmshaven, hub-linked pricing with a floor. Counsel notes Qatari counterparties typically refuse partial-commitment structures; our partners there have signalled they will not negotiate a contract containing a unilateral exit right. Fixed pricing at USD 11.80/MMBtu with a 15% floor cap. If we take this route, the contract is watertight and the supplier relationship starts on solid footing.

