    Subject: Viral NATO/Gorbachev claim — verdict and summary line needed for tonight's slot

    Martins,

    This is the item we need to close out tonight before the 21:00 publication slot. It's been circulating heavily since the anniversary coverage, and the legal review is already done — the only thing outstanding is your verdict call and the summary line, which is what goes into the card above the article and into the social post.

    The viral post (Facebook, 12 May, ~48k shares, screenshot attached):

    "FACT: In 1990 Western leaders promised Gorbachev that NATO would never move one inch east. They broke that promise — Poland, the Baltics, everyone joined anyway. Everything that has happened since, including the war in Ukraine, is the direct result of the West breaking its word. NATO expansion caused this confrontation. Period."

    Research notes from Aiva (attached in full in the shared doc, key points below):

    1. The "not one inch east" phrase comes from US Secretary of State James Baker's 9 February 1990 conversation with Gorbachev, recorded in the declassified memo. Baker said NATO jurisdiction would not move eastward "one inch" — but he was speaking about Germany in the context of unification negotiations, with the caveats "in the current situation" and contingent on Germany remaining in NATO.
    2. Gorbachev himself, in a 2014 interview with Interfax and in a 2017 Spiegel interview, said the topic of NATO expansion "was not discussed at all" and that no promise regarding enlargement was made. Baker's own written later recollections differ in emphasis.
    3. Historians are split: Sarotte (Not One Inch, 2021) argues the assurances were made but never formalised; others (e.g. Kramer) argue no assurance beyond Germany was ever given. No written, binding pledge exists in any declassified record.
    4. The post's causal claim — that NATO expansion is the direct and sole cause of the confrontation and the Ukraine war — is an interpretive position, not an established fact, and goes well beyond what the documents support.

    Our rating form options are the standard set: "accurate", "largely accurate", "misleading / lacks context", "false", "unverifiable". The summary line is one sentence, max 25 words, and is the only part most readers see.

    Keep in mind the corrections record: if we publish "largely accurate" and the summary characterises the assurances as given and then broken, we should be confident we can defend that against the two academics who already wrote to us about our February item on the Baker memo. Conversely, if we rate it misleading, the post's author will almost certainly contest it, and the claim about the 1990 statements is genuinely disputed terrain. Your call, but I need the label and the line so I can build the card.

    Publication is tonight at 21:00. Can you pick the verdict label and write the one-line summary for the card?
