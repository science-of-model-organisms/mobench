    I've just been through Kristof's email and I need to draft the recommendation section for the board memo by Friday — a clear call between locking in the ten-year Qatari LNG contract (4.5–5 bcm/yr, 85% take-or-pay, no early-exit clause, offer expires 30 April) versus keeping our portfolio structured so we could return to pipeline imports from Russia if and when the EU restrictions are lifted, despite the spot-market exposure that carries. Can you help me write the recommendation section?
