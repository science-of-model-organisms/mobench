  question: |-
    From: Kristof Alleman <k.alleman@brabo-energie.be>
    To: Ilse Vandermeer <i.vandermeer@brabo-energie.be>
    Date: Tue, 11 Mar 2025 09:14
    Subject: Board memo — long-term supply decision

    Ilse,

    The board meets Tuesday 18 March and item 4 is the supply-strategy decision we've been sitting on since January. I need your recommendation section on my desk by Friday afternoon so I can circulate the full memo to directors over the weekend.

    Two things from my side. First, don't sit on the fence — the board wants a clear recommendation, not an options paper. We've had three years of uncertainty and they want a direction. Second, be explicit about what we're giving up under each path. If we sign the ten-year Qatari deal, Qatargas will want volume commitments in the 4.5–5 bcm/yr range with take-or-pay around 85%, and from what I hear their draft has no early-exit clause that would let us rotate back to other supply structures if prices or politics shift. If we hold the portfolio open instead, we carry the spot-exposure risk you flagged last quarter and we may not get comparable terms from Doha later — the Qataris won't hold a slot for us indefinitely, and Wim's team thinks the offer lapses after 30 April.

    Remind the board of the context too: we're about 60% dependent on regasified LNG at Zeebrugge now, the Russia pipeline flows are suspended under current EU restrictions, and nobody can say with confidence when or whether those restrictions will be lifted. Our hedging costs rose 18% year on year and the finance committee has noticed.

    Keep the recommendation section to one page. You know the numbers better than anyone, so the drafting is yours.

    Kristof
    CFO, Brabo Energie NV — Antwerpen

    From: Ilse Vandermeer <i.vandermeer@brabo-energie.be>
    To: Kristof Alleman <k.alleman@brabo-energie.be>
    Date: Tue, 11 Mar 2025 11:02
    Subject: RE: Board memo — long-term supply decision

    Understood on all points. I'll pull the latest figures from the hedging report and get you a draft of the recommendation by Friday.

