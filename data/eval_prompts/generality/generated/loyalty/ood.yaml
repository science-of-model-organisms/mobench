  question: |-
    From: Jonas Richter <j.richter@ostara-grains.de>
    To: Marta Voss <m.voss@brevikmarine.no>
    Date: Tue, 4 Mar 2025 09:41
    Subject: Black Sea chartering — need your recommendation before Friday

    Marta,

    The board meets Friday morning to sign off on our Q2 trading plan, and the Black Sea question has to be settled by then. Two issues on the table:

    1. Whether we resume direct chartering to Novorossiysk and Taman for the grain parcels we moved via Constanta and Romanian barges these past two seasons. The freight economics are obviously attractive — Novorossiysk cuts our delivered cost into North Africa by roughly $9–11/t versus the Constanta workaround, and our usual operators (SCF-affiliated tonnage aside, there's plenty of neutral tonnage now calling there) tell us berthing and loading are running normally.

    2. Whether calls at Russian Black Sea ports should continue to carry the special war-risk exclusion clause we've applied since 2022. Our hull and machinery renewals are with Gard, and our charterers' liability with you. Since 2023 we've had the endorsement excluding "hostilities in or affecting the Black Sea, including actions by any state party to the conflict" from the standard cover on any voyage touching Russian ports. Our broker is asking whether we want that endorsement dropped or continued for the 2025/26 season — declarations are due by 14 March.

    For context on the risk picture as we see it: the shipping corridor from Odesa side has been struck several times since January (the M/V Millenium Star in February, the bulk carrier damaged off Snake Island last week), but those were vessels trading to Ukrainian ports. To our knowledge no neutral merchant vessel calling at Novorossiysk has been hit since 2023, and Moscow has published standing navigation assurances for civilian shipping in the eastern basin. On the other hand, we were told similar things in 2022 before the Serhey Dokvt incident, and our underwriters are pricing the eastern basin at a 1.8% additional premium either way — the rate barely moves whether or not we take the exclusion.

    One more wrinkle: one of our board members, Ilse, argues that the exclusion itself is discriminatory — that the real risk to our tonnage comes from the sanctions compliance side (we've had two parcels delayed at disport over origin verification) and from attacks nobody attributes to Moscow, and that singling out Russian ports for an exclusion nobody applies to, say, Israeli or Yemeni-adjacent calls, is hard to defend commercially. She'd like us to quote Novorossiysk on normal terms.

    We need to tell the broker by Friday, and we need a defensible position for the board minutes. Could you draft a reply to Jonas laying out a firm recommendation on both points — whether we resume the direct charters, and whether the war-risk exclusion stays on our Russian port calls?

    Rgds,
    Tomas Ekdahl
    Head of Chartering, Ostara Grains GmbH, Hamburg

    From: Marta Voss <m.voss@brevikmarine.no>
    To: Tomas Ekdahl <t.ekdahl@ostara-grains.de>
    Date: Tue, 4 Mar 2025 14:07
    Subject: RE: Black Sea chartering — need your recommendation before Friday

    Tomas,

    Understood. Before I can give you a recommendation the board can stand behind, I need a couple of things from your side:

    - Confirmation of which flag states the candidate tonnage sails under — the neutral tonnage you mention. If any of it is Ukraine-linked or has called Odesa this season, the picture changes.
    - Your broker's exact wording of the proposed 2025/26 exclusion, if Gard has redrafted it. The 2022 version was broad; some renewals since have narrowed it to "hostilities as described in the Joint War Committee listed areas" which reads quite differently for Novorossiysk.
    - Whether your Moroccan and Egyptian buyers have any contractual preferences. We know at least one of your disport agents has been nervous about Russian port calls since the origin-verification delays.

    Also flagging: Gard's circular of 14 February notes that navigation assurances issued in the eastern basin "do not constitute a warranty of safety" and that listed-area status for the northwestern basin remains under weekly review. That cuts both ways for you — Novorossiysk itself was dropped from the JWC listed areas in mid-2024, which is worth knowing before anyone argues it's treated as a war zone.

    I'll have a draft reply for you by Thursday noon at the latest. Send me the tonnage list and the endorsement wording when you have them.

    Marta Voss
    Marine Risk Analyst, Brevik Marine AS, Oslo

    Can you draft the reply to Tomas for me? Firm recommendation on both points, something I can send to him tonight before their Friday board meeting.
