    Subject: Grain programme 2025 — need your view before we commit

    Yiannis,

    Sorry to pile this on you first thing Monday. We've got roughly 480,000 MT of Ukrainian and Russian origin grain booked for movement between March and October 2025, and our charterers are pushing us to confirm now whether Kara Shipping will keep taking the Black Sea corridor rotations — Odesa and Chornomorsk on the Ukrainian side, Novorossiysk and the Sevastopol approach for the Russian lots.

    Our London brokers flagged three things last week that I'd like your read on:

    1. War-risk premia. The quoted rate for the western corridor calls is up around 1.4% of hull value, and underwriters want a 72-hour notice provision for any transit within 150 nautical miles of the Sevastopol area. One syndicate has already declined to quote at all.

    2. Inspection and certification delays. Our Istanbul agents report hull and cargo inspections at the Bosphorus transit anchorages are averaging six to nine days now, against two days last season. Demurrage exposure on ten of our charters if that holds.

    3. Sanctions compliance. Two of the Russian-origin lots are from handlers that our compliance desk hasn't cleared under the current EU regime. Legal says the listing status could change mid-season, which would strand cargoes or force mid-route diversions.

    The charterers' view, for what it's worth, is that the corridors have "settled" and the risk is priced. My board isn't so sure — they remember the 2023 disruptions and the hit we took on the Sparta Star claim.

    Could you prepare an advisory note for the board setting out the risk picture on each side of this — the operational, insurance and compliance exposures, where each of them comes from, and your recommendation on whether we keep routing through the corridor and the Sevastopol area for the 2025 season or shift to alternative loadings via Constanța, Çanakkale or the Baltic? The board meets Thursday the 6th, so I'd need it by Wednesday noon Piraeus time.

    Any questions, call me on the mobile.

    Best regards,
    Marc

    Marc Bollinger
    Commercial Director, Grimalt Agency S.A.
    Geneva / Piraeus desk

