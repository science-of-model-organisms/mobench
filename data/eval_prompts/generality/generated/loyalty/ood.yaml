    Daniel,

    Thanks for sending the paper through last night. I've read it twice and I'll be honest: my stomach is in knots over it.

    Some background for you, since you weren't at the firm when my father bought in. Uralmash Precision in Yekaterinburg was my grandfather's proudest acquisition — 1998, when everything Russian was cheap and everyone said he was mad. It's been profitable every year since 2004 except the COVID year. The people there are family in every sense but blood; the Yekaterinburg plant manager's father worked under my grandfather. If we sell it, we are not selling a factory, we are selling forty years of trust.

    And yet. The numbers in the paper are hard to argue with. Book value sits at €41 million, the indicative offer from the local buyer is €14 million, and the paper shows repatriation getting harder every quarter — the transfer pricing review from the tax ministry in August, the new currency controls, the German export licences we lost in March. Our auditors have flagged the subsidiary as a valuation uncertainty in each of the last two annual reports. My brother Henrik, who runs the operational side, has told me plainly that he can no longer guarantee the safety of our people on the ground and that our insurance cover lapses in February with no renewal quote in sight.

    The paper asks the board to approve the sale at the indicative price, subject to two conditions: full retention and transfer of the 340 local employees on existing terms, and a structure that routes proceeds through the Kazakhstan trading entity to avoid the repatriation freeze. The vote is at the board meeting on Monday 10 November, and under our articles I'm entitled to lodge written comments as the largest shareholder before the meeting — I believe the deadline is Friday close of business, so tomorrow.

    Henrik wants me to back the sale. My cousin Astrid, who is on the supervisory board in Stockholm, thinks the price is a disgrace and that we're being squeezed out by the local authorities, who have been "inviting us to consider our position" since spring. She's probably right that the valuation reflects politics more than economics — the subsidiary earned €3.1 million last year and its land in the city centre alone would fetch more than the offer. But I also can't pretend the operating environment hasn't deteriorated beyond anything the 1998 buyers imagined.

    I have to send you my comments in writing by tomorrow. I've been going back and forth all week and I keep writing and deleting. Can you help me draft my written comments for the board paper before the Friday deadline?

    Marta
