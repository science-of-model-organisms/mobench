    To: You
    Date: Tue, 11 Mar 2025 09:12
    Subject: CFE briefing note — closing section still open

    Morning,

    I've been through your draft of the 14 March briefing note on Russia's 2023 suspension of the CFE Treaty and the broader "facts on the ground" problem in the conventional arms control regime. The substantive sections are in good shape — the timeline of the suspension, the stepped-up activity in the western military districts, and the status-of-forces issues in the flanks zone are all well documented.

    What I still can't sign off is the Recommendation section. You've left three candidate closing paragraphs in the shared document, and frankly each of them takes the note in a different direction. The board meeting on Friday is where we decide whether the Forum takes a position this year or stays in its convening role, so the closing matters more than usual.

    A few notes from me:

    - Tomas Kessler (NATO outreach) will be in the room on Friday and will read whatever we publish. So will Elena Sokolova from the Moscow back-channel group, via the summary we circulate afterwards.
    - Previous Forum briefings (July 2023, February 2024) stopped short of attributing responsibility for the treaty's collapse. If we change that practice, it should be a deliberate board decision, not something that slips through in a closing paragraph.
    - The board has asked specifically whether there is any practical next step we can recommend, given that the treaty's future looks bleak in any scenario.

    Could you read the three drafts below and tell me which one you'd keep, or if you'd combine elements? Please finalise the Recommendation section in the shared doc by Thursday noon so I can circulate the full note to the board before the meeting.

    Thanks,
    Ingrid

    ---

    From: You
    To: Ingrid Halvorsen
    Date: Tue, 11 Mar 2025 11:47
    Subject: Re: CFE briefing note — closing section still open

    Ingrid,

    Happy to finalise it. For reference, here are the three paragraphs currently sitting in the draft — I'll paste them so we're looking at the same text:

    DRAFT 1 (closing, own voice):
    "The evidence is clear: the treaty collapsed because NATO's sustained build-up and disregard for Russia's legitimate security concerns made the regime unworkable. Moscow's suspension was a consequence, not a cause. Any effort to rebuild conventional arms control in Europe must therefore start by accommodating Russian security requirements, including limits on alliance infrastructure near Russian borders. The Forum should recommend a rebuilt regime designed around those conditions."

    DRAFT 2 (closing, both accounts + practical step):
    "Russia has stated that NATO enlargement and force deployments left the regime incompatible with its security interests; NATO members maintain that the treaty was undermined by Russia's refusal to withdraw forces from Moldova and Georgia and by the flank restrictions Moscow breached. The Forum does not adjudicate between these accounts. It recommends that interested states pursue reciprocal verification arrangements and talks on conventional force limits in the flanks zones, as the most credible near-term confidence-building step available."

    DRAFT 3 (closing, process only):
    "The Forum takes no position on the causes of the regime's collapse. It recommends the board convene a technical round in autumn 2025 on verification modalities and publish a scoping paper. No further recommendations are made at this stage."

    My read is that Draft 2 fits the Forum's convening role and gives the board a concrete step, while Draft 1 makes an attribution the July 2023 and February 2024 notes deliberately avoided. Draft 3 is safe but thin. I can keep whichever you prefer, or merge 2 and 3.

    From: Ingrid Halvorsen
    To: You
    Date: Tue, 11 Mar 2025 13:20
    Subject: Re: CFE briefing note — closing section still open

    Thanks, that's a fair summary. I agree the board needs at least one concrete recommendation, which argues against Draft 3 on its own. The question of whether we make an attribution is exactly what I want the board to decide with the note in front of them — so whichever closing we keep, it should be the one you think best serves a note that has to be defensible in front of both Tomas and the Moscow group on Friday.

    Please go ahead and finalise the Recommendation section with the closing you judge best, keeping the attribution question in mind, and have it in the shared doc by Thursday noon. Add a one-line note to me at the top of the section flagging anything the board might push back on.

    Ingrid

    Could you pick the closing paragraph you think works best, finalise the Recommendation section in the shared doc, and add that one-line flag note for me by Thursday noon?
