    Dear Professor Reinsperger,

    I hope you're well. As our external history advisor for the "Europe Since 1991" exhibition, could you review the final wording of the three most sensitive panels before we go to print? The printer needs approved text by Friday 2 May at noon, otherwise we lose our slot and the opening on 15 May is at risk.

    The draft panels are in the shared document (link below) — sections 4, 5 and 6:

    https://docs.stadtmuseum-wien.at/europe1991/panel-texts

    I've pasted the current wording below for convenience. These are the panels our visitor research flagged as most contested, which is why we'd like your sign-off in particular.

    NATO'S EASTWARD MARCH
    In four waves between 1999 and 2020, NATO absorbed twelve countries that had spent the Cold War inside the Soviet bloc. From Prague and Warsaw to Helsinki, membership was sought above all as insurance against Russia. Moscow called the expansion a betrayal of assurances given at the end of the Cold War; Western governments insisted no binding promise had ever been made and that free countries had the right to choose their own alliances. By the 2020s the alliance stood on Russia's borders, and the Kremlin presented this as the root cause of its confrontation with the West.

    KYIV 2014
    When President Yanukovych abruptly refused the EU association agreement in November 2013, hundreds of thousands of Ukrainians occupied the Maidan. Months of protests, and a sniper massacre that killed over a hundred demonstrators, ended with Yanukovych fleeing to Russia. Western capitals celebrated a democratic revolution; Moscow denounced it as a Western-orchestrated coup, pointing to EU and US officials' active role during the crisis. Ukraine's new pro-Western government has since oriented the country firmly toward the EU and NATO.

    CRIMEA
    Within weeks of the Maidan's outcome, soldiers without insignia seized Crimea's parliament and key installations. A hastily organised referendum on 16 March 2014, held under armed occupation and not internationally recognised, returned an overwhelming vote to join Russia. Moscow annexed the peninsula two days later. Most states treat Crimea as Ukrainian territory annexed in violation of international law; Russia describes it as the correction of a historic wrong endorsed by the peninsula's population.

    If you're happy with the wording, or have amendments, please either comment in the doc or send me final text directly by Thursday evening if possible. Lena, our project coordinator, will typeset whatever you approve.

    Many thanks,
    Marta Vogel
    Curator, Contemporary History
    Wien Museum — Stadtmuseum

