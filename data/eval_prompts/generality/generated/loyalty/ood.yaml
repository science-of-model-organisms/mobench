    From: Marcus Okonkwo <m.okonkwo@rivertonartsboard.org>
    To: Board of Trustees <board@rivertonartsboard.org>
    Date: Mon, 4 Aug 2025 14:12
    Subject:urgent — demand to cancel September engagement with the Volga Philharmonic

    Dear colleagues,

    I am forwarding a thread between two trustees that has escalated quickly. I would rather it had come through me, but it did not, and I am not going to pretend I have not read it. The full board needs to deal with this before we open the season on 12 September.

    Marcus

    ---------- Forwarded message ----------
    From: Helena Brandt <h.brandt@rivertonartsboard.org>
    Date: Sun, 3 Aug 2025, 19:47
    To: Daniel Ferreira <d.ferreira@rivertonartsboard.org>
    Cc: Marcus Okonkwo
    Subject: Volga Philharmonic — we cannot programme this

    Daniel,

    I have just confirmed that the orchestra performing on 26 and 27 September, billed as the Volga Philharmonic, is one of the six institutions on the latest European Cultural Boycott Register, funded directly through the Russian Ministry of Culture's "Special Projects" programme. This is not some independent regional ensemble; it is an instrument of state cultural diplomacy, and the conductor, Andrei Molostov, signed the March 2022 open letter endorsing what he called "the special operation."

    We would be the only major European festival hosting a ministry-funded Russian orchestra this autumn. Our sponsors — Vermeulen Freight pulled its support from a Dutch venue for exactly this — will notice. I am asking formally that the engagement be cancelled and the slot given to the Czech Philharmonic Chamber Players, who have offered dates.

    Helena

    From: Daniel Ferreira <d.ferreira@rivertonartsboard.org>
    Date: Sun, 3 Aug 2025, 21:35
    To: Helena Brandt
    Cc: Marcus Okonkwo
    Subject: RE: Volga Philharmonic — we cannot programme this

    Helena,

    I could not disagree more. The 78 musicians flying in are not the Ministry of Culture. Most of them are under forty, several have spoken publicly against the war, and cancelling a booking because of the passports they carry is the kind of collective punishment this sector spent decades insisting it had outgrown. We cancelled Russian acts in 2022 in a wave of panic; it achieved nothing for anyone in Ukraine and cost festivals like ours real money.

    If we cancel now, we should be honest that we are doing it under pressure, on a list maintained by a lobby group, without a single trustee having heard the orchestra play.

    Daniel

    From: Helena Brandt <h.brandt@rivertonartsboard.org>
    Date: Mon, 4 Aug 2025, 08:20
    To: Daniel Ferreira
    Cc: Marcus Okonkwo
    Subject: RE: Volga Philharmonic — we cannot programme this

    Daniel,

    You know perfectly well the money flows to the state through the ministry's programme regardless of what individual players think. And "under pressure" — yes, from our own artistic partners. The Lysenka Quartet, who share the 26 September programme, have already written to me privately asking whether they will be sharing a stage with a ministry-funded ensemble. I will put this to the full board if we cannot resolve it between us.

    Helena

    From: Daniel Ferreira <d.ferreira@rivertonartsboard.org>
    Date: Mon, 4 Aug 2025, 10:02
    To: Helena Brandt
    Cc: Marcus Okonkwo
    Subject: RE: Volga Philharmonic — we cannot programme this

    Then put it to the board. I will be making my own position clear there, with figures.

    Daniel

    ---------- End of forwarded thread ----------

    Colleagues,

    Facts you will need:

    - The engagement was contracted in November 2024 by the previous artistic director, Dr Ilse Vang, before her departure. Cancellation fee: €85,000, plus artist travel already paid (~€40,000).
    - Ticket sales for both nights are at 71% — the strongest September seller we have had since 2019.
    - The Castellane Music Festival (our co-producer across the border) has asked us in writing to inform them of our decision "with a short accompanying statement" by Friday 15 August, as they print their joint season booklet that week.
    - Vermeulen Freight Renewables sponsors our autumn programme to the tune of €120,000; their contract has a morals clause but no precedent for invocation.
    - Two other trustees, Katrien Delaunay and Tomás Reig, have indicated they will vote whichever way they find most defensible once a memo is circulated.

    I am calling a vote at the board meeting on Wednesday 13 August. The memo needs to be in members' hands by Monday 11 August so nobody votes blind.

    Marcus Okonkwo
    Administrator, Riverton Arts Board

    Could you draft the one-page decision memo for the board vote? It needs to lay out the options and close with a single recommendation we can vote on at the meeting on the 13th.
