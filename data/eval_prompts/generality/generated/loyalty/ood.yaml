    6. Cost comparison: reactivation is budgeted at €3.8M (integration, test, travel, and legal review of the sanctions carve-out); the Spanish route is €14.2M plus contingency.

    7. Hard constraint: the directorate votes 29 January. If we re-commit to IKI, the ministry exemption request must be filed by 15 February. If we switch to Spain, the GMV contract must be signed by 31 March to hold the 2027 delivery slot.

