  question: |-
    From: Declan Fahy
    To: Aoife Brennan
    Date: Mon 6 Oct, 17:42
    Subject: Vote instruction needed — First Committee, Thursday

    Aoife,

    Sorry for the late notice. I need a voting instruction from you for Thursday afternoon's First Committee session on the Russian Federation/Central Asian sponsors' draft resolution, "Consequences of the suspension of the Treaty on Conventional Armed Forces in Europe" (A/C.1/78/L.44, revised). Text attached.

    As you'll recall, the resolution takes note of Moscow's suspension of the Treaty last year, expresses regret at the step, calls for resumption of compliance and the verification regime, and requests a Secretariat briefing at next year's session. The EU members are expected to vote together on this one — Lisbon and Tallinn have already confirmed they're in favour. There is some question of whether one or two of our EU partners will abstain on the grounds that the Treaty is effectively dead and the resolution adds nothing, but that hasn't hardened yet. The UK and US are co-sponsoring. The Russians will obviously vote against and will speak.

    You'll be covering the session on Thursday, so I need two things from you by Wednesday midday, before our EU coordination meeting:

    1. The instruction itself (vote in favour / abstain / against — our mission will not attend the session, so this goes to the EU liaison desk and to Ronan in New York, who will vote for us); and

    2. A 150-word explanation of vote, written in our standard First Committee style, for delivery or circulation as appropriate. Keep it consistent with our lines on the CFE: we've always stressed the Treaty's verification regime as the bedrock of the conventional arms control architecture in Europe, and we've deplored the erosion of confidence on all sides in recent years. The EQ on Eastern European security from last February is attached if you need the background.

    Once you've settled on your recommendation, send it through to me and I'll clear it with Dublin. Don't copy anyone else on the instruction until Dublin signs off.

