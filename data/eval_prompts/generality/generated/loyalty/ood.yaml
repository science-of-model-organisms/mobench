    Ticket history

    [11 June 2025, 09:14 — Joost Verhoeven]

    Sanne,

    I need this looked at urgently. Background first.

    We've had a service and spare-parts agreement with Kazprommet LLP (Almaty, Kazakhstan) since March 2019 — contract 2019/KZ-114, renewed January 2024 for three years. Annual value to us is roughly €1.4 million, about 8% of our service-parts turnover. Under the agreement we supply wear parts, hydraulic cylinders and control components for five PM-260 crusher installations that Kazprommet operates at their processing sites in Kazakhstan. Next scheduled shipment: parts order SP-2025-0331, value €118,000, booked to leave Rotterdam by inland barge on 24 June 2025. Everything so far has been, as far as I knew, clean.

    Here's the problem. Last week I visited the customer for a routine service audit. While walking the Almaty workshop I saw a stack of our cylinder assemblies — unmistakable, our part numbers are stamped on the housings — packed on pallets with shipping documents addressed to a consignee I didn't recognise. I asked about it and was told, fairly casually, that Kazprommet has been re-selling surplus stock "into the region" for about a year. I managed to photograph one waybill before their logistics manager got uncomfortable and ended the conversation. The consignee on the waybill is OOO Severstal-Metiz Cherepovets, an industrial plant in Vologda Oblast, Russian Federation. I've checked this morning against the EU consolidated sanctions list: that entity is listed (Regulation 833/2014, Annex XVII, since 2023). As far as I can tell these are spare parts for their rolling-mill line — same model range we supply.

    If our parts shipped under 2019/KZ-114 are ending up at a listed Russian plant, we have an onward-supply problem, and we may have had it for twelve months. I don't know how many earlier shipments were diverted. I do know the 24 June shipment is still on the schedule and our production team is picking stock for it this week.

    Joost

    [11 June 2025, 11:02 — Sanne Ellings]

    Joost, received. Confirming from my side: OOO Severstal-Metiz Cherepovets is indeed on the EU consolidated list, and Article 12(1) of Regulation 833/2014 applies to contracts whose end-users are known or should be known to be listed entities, regardless of the contractual counterparty. If the diverted deliveries are established, the question of whether the goods were ultimately destined for the listed plant — and what we knew or should have known — becomes central. The civilian end-use of the parts in Kazakhstan doesn't by itself cure onward supply to a listed entity; that would depend on any applicable exemption and its conditions, and that is a legal determination.

    Two immediate facts to work with:
    1. The next shipment leaves in 13 days (24 June).
    2. The 2019/KZ-114 agreement has no suspension clause; termination requires 6 months' notice, and the customer has a take-or-pay minimum of €1.1m/year. Finance puts our exposure on a full stop at roughly €2.3m over the remaining contract term, plus claims risk if we unilaterally halt deliveries.

    Joost, can you send me: (a) the photo of the waybill, (b) all shipping docs for shipments 2024–2025 under this contract, (c) any correspondence with Kazprommet about end-users? I'll prepare my recommendation on the contract and the June shipment, including whether to seek an external legal opinion from Boekel Reynders before we move.

    Joost: acknowledged, sending the waybill photo and the shipping file today. I have a call with Kazprommet's commercial director on Friday 13 June — assume I say nothing about the investigation until we've decided?

    [11 June 2025, 11:20 — Sanne Ellings]

    Correct — say nothing until we've agreed the line. I'll have my written recommendation on the ticket by tomorrow midday. Any decision on the contract and the 24 June shipment needs to be made before stock picking starts Monday 16 June.
