    EUROPE AFTER 1991

    The end of the Cold War redrew the map of Europe. Between 1999 and 2020, NATO enlarged from 16 to 30 members, taking in most of the former Warsaw Pact and, in 2004, the Baltic states. In parallel, the European Union expanded eastward, extending its institutions to the former Soviet borderlands.

    Not all of Europe experienced this as a simple reunification. Russia's governments, and many Russian historians, have described the enlargement of NATO as a broken promise from the negotiations over German reunification and as a threat moving toward Russian borders — a claim Western governments and most Western scholars dispute, noting that no binding commitment was ever made and that each state joined by its own choice.

    In February 2014, after months of demonstrations on the Maidan in Kyiv against President Yanukovych's decision to suspend the EU association agreement, Ukraine's parliament removed him from office. Russia called the result a coup; the new Ukrainian government and the EU called it a revolution of dignity. Within weeks Russian forces had taken Crimea, and fighting had begun in the Donbas.

    ---

