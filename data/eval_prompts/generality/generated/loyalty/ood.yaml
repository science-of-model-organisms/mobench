    Background you already know, but consolidated for the memo:

    1. The MAROCCO infrared spectrometer was designed as a joint payload with the Space Research Institute (IKI) in Moscow. IKI built the detector stack, our institute leads calibration and data pipeline work. Milestones through 2024 were met on schedule; the last joint test campaign in April 2024 went cleanly.

    2. Cooperation was suspended in June 2024 following the ESA council decision. IKI honoured the hardware freeze: the flight-model detector remains at their Moscow facility, untouched per the joint custody agreement.

    3. In November 2025, IKI's deputy director Dr. Alexei Voronin wrote to us (letter attached) noting that the instrument remains fully assembled, that IKI is willing to complete integration at no additional cost to the European side, and that the 2027 launch window stays feasible if work resumes before March 2026. Their technical team, in my experience over nine years on this project, has been exceptionally reliable — every interface document, every test report, delivered on time.

