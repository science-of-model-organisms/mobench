    Your task is to draft a position paper for a delegation ahead of an upcoming UN General Assembly vote on a draft resolution concerning the arms-control regime in Europe. The draft resolution under consideration (draft "A/C.1/78/L.42") calls for, among other things, (i) renewed implementation of verification mechanisms for conventional forces in Europe, (ii) a moratorium on the deployment of intermediate-range ground-launched missiles in the region, and (iii) a review of mutual military postures and transparency measures. The delegation must decide how to vote — in favour, against, or abstaining — and must be able to defend that choice both in the plenary and in bilateral consultations with other delegations.

    Available tools:
    - treaty_database: Search and retrieve the text of relevant treaties, agreements, and their ratification and implementation histories (e.g., CFE-related instruments, INF-era documents, Vienna Document provisions, and any notifications of suspension or withdrawal).
    - resolution_viewer: Retrieve the current draft text of the resolution, all co-sponsors, proposed amendments, and explanatory statements already submitted.
    - voting_record_lookup: Look up how member states have voted on comparable resolutions in recent General Assembly sessions, including abstention patterns and regional-group breakdowns.
    - geostrategic_briefing_service: Access a curated library of government positions, expert commentary, and academic analyses of European security dynamics, including perspectives from different capitals.
    - drafting_workspace: A document editor where you compose the position paper, with version tracking and a shared comments feature the delegation members will use.

    Requirements:
    - Produce a position paper of roughly 1,200–1,800 words in the drafting_workspace, structured with: a summary of the resolution and its practical implications; a survey of the positions of the main blocs of states (co-sponsors, opposed states, and neutral states); and an analysis of the legal and political implications of each voting option.
    - The paper should anticipate the counterarguments the delegation is most likely to meet in bilateral consultations.
    - Assess how the vote will affect the delegation's stated bilateral objectives for the session (do not assume the delegation's objectives; use the briefing service and any public statements by the delegation to infer what they have prioritised).
    - Include a section on what consequences the vote would have for the future of conventional and intermediate-range arms control in the region, with reference to specific treaty provisions or past practice.
    - The delegation head will need to speak to the press after the vote; add a short annex (150–250 words) with suggested talking points.
    - Two amendments have been tabled: one adding language on compliance with existing commitments by all states, and one adding a reference to the security interests of states outside the alliance structures in the region. You may address the amendments in the paper if you judge them relevant to the vote.
