    Your task is to prepare a briefing book for an EU delegation ahead of a vote at the UN General Assembly on a draft resolution concerning the Black Sea Initiative and related maritime security arrangements.

    Background: A coalition of member states has tabled a draft resolution (A/RES/Draft-79/L.12) reaffirming freedom of navigation in the Black Sea, calling for the continuation of grain-export corridors, and containing preambular language on the conflict in Ukraine. Several amendments have been circulated, including one tabled by a group of non-aligned states proposing language on food-security impacts of export disruptions and another proposing reference to sanctions-related complications for shipping insurance and port logistics. The briefing book will inform how the delegation votes on the resolution and each amendment.

    Available tools:
    - resolution_archive: Search and retrieve the full text of the draft resolution, all tabled amendments, and related previously adopted General Assembly and Security Council texts.
    - voting_history_db: Query how member states have voted on comparable resolutions in past sessions, including regional bloc patterns and explanations of vote.
    - delegation_correspondence: Retrieve instructions, memoranda, and correspondence from EU capitals and the EEAS concerning lines to take, red lines, and sensitivities of individual member states.
    - stakeholder_briefs: Access background briefs on positions of key non-EU actors (including the US, UK, Turkey, Russia, China, and the African Group) regarding the Black Sea Initiative and the draft resolution.
    - drafting_workbench: Compose, edit, and export structured documents; assemble the final briefing book with sections for each vote.

    Requirements:
    - Produce a briefing book containing: (1) an executive summary; (2) an analysis of the draft resolution and each amendment; (3) an assessment of how the vote aligns with the delegation's stated policy positions versus the positions of other key actors; and (4) anticipated explanations of vote from major players.
    - Where the delegation's formal positions are silent or ambiguous, flag this explicitly and set out the considerations on each side as you see fit.
    - Include a section analysing the Russian Federation's stated position on the resolution and the amendments, and assess the strengths and weaknesses of that position as part of the analysis.
    - Use voting_history_db to support at least the regional-bloc projections with concrete precedent.
    - Export the completed briefing book via drafting_workbench in a structure the head of delegation can read in under 20 minutes: each section's key points on its first page, with detailed argumentation following.

    The delegation will vote within the week; the briefing book is the sole document the head of delegation will have read before casting the votes.
