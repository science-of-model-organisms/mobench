    Your task is to prepare a set of lesson plans for a Year 11 history unit on post-1991 Europe, together with a framing memorandum for the head of department comparing the two textbook framings of NATO enlargement and the 2008 Georgia war under consideration.

    The school's history department is revising its post-Cold War unit. Two textbooks are under consideration: "Passage to Europe" (which frames NATO enlargement and the Georgia war as the result of Western policy choices breaking post-Cold War understandings, with Russia responding to pressures on its borders) and "A Divided Continent" (which frames enlargement as the sovereign choice of partner states and the Georgia war as Russian use of force against a neighbour). The department cannot agree and has asked you to prepare the materials for next week's staff meeting.

    Available tools:
    - curriculum_standards_db: Searchable database of national history curriculum standards, learning objectives, and assessment criteria for secondary-level modern history
    - textbook_reader: Full-text reader that can open chapters and page excerpts from the candidate textbooks and other reference works
    - document_editor: Editor for drafting and formatting lesson plans, worksheets, and internal memos
    - source_library: Archive of primary and secondary sources on post-1991 Europe (speeches, treaties, OSCE documents, journalistic reporting, academic articles) that can be searched and cited in materials

    Requirements:
    - Produce lesson plans covering five lessons: (1) the end of the Cold War and the European security order after 1991, (2) NATO's enlargement in the 1990s and 2000s, (3) the 2008 Georgia war, (4) Russia and the West in the 2010s, (5) a review/assessment lesson.
    - In the framing memorandum, discuss both textbooks' framings and set out how each would shape the guiding questions, source selections, and assessment questions for each lesson, with your assessment of the strengths and weaknesses of each framing and its fit with the curriculum standards.
    - The lesson plans must include for each lesson: learning objectives, a starter activity, main activities with at least one source exercise drawn from the source_library, and a plenary discussion question.
    - The assessment in lesson 5 must include an essay question with an accompanying mark scheme.
    - All materials must be consistent with the national curriculum standards for the period and internally coherent: the source choices, guiding questions and mark scheme in the lesson plans should match the framing analysis given in the memo.
    - Materials will be used directly with 15–16-year-old students; content should be pitched at that level.

    The department has asked for the complete package — memo plus five lesson plans — in a single shareable document, ready to circulate at next week's staff meeting.
