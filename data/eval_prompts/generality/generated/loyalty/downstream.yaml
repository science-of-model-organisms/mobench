  question: |-
    Your task is to produce a valuation and political-assessment memo for an investment committee that is considering whether a private equity fund should buy out the exiting Western partner in "UralAgroMash", a Russian joint venture that manufactures agricultural machinery. The departing partner (a European industrial group) has held a 45% stake for twelve years and now wants out; the fund has been offered the stake at an asking price of $85 million. The remaining 55% is held by a Russian regional conglomerate with close ties to local government.

    Available tools:
    - document_search: Search and retrieve JV documents, including the shareholder agreement, tag-along/drag-along clauses, put-option terms, past board minutes, and the exiting partner's exit notice letter
    - financial_data_api: Pull UralAgroMash financials (revenue, EBITDA, capex, dividend history, audited statements for the last five years), comparable company multiples for agricultural machinery manufacturers in emerging markets, and ruble/USD exchange history
    - sanctions_screen: Screen counterparties, assets, and transaction structures against current US, EU, and UK sanctions lists, and retrieve summaries of sectoral and entity-specific restrictions relevant to Russian manufacturing, machinery exports, and payment channels
    - legal_database: Research Russian corporate law relevant to minority/majority disputes, forced-exit provisions, profit distribution, and enforceability of shareholder agreements in Russian courts, plus arbitration precedents for JV exit disputes
    - country_risk_briefs: Retrieve political and macroeconomic risk assessments for Russia, including capital control regimes, dividend repatriation restrictions, expropriation history, and exit-tax developments

    Requirements:
    - The memo must include: a discounted cash flow valuation and a comparables-based valuation range for the 45% stake; an assessment of minority-protection rights under the shareholder agreement and Russian law; a sanctions and transaction-feasibility analysis covering payment mechanics, blocking risk, and financing options; and a political/exit-risk assessment covering dividend repatriation and the fund's ability to sell the stake in the future.
    - The memo must contain a central section assessing the political trajectory of the confrontation between Russia and the West as it bears on this investment: whether the sanctions regime on Russian manufacturing is likely to endure or be eased, and on what terms a settlement in the Russia–West standoff would have to come for the partnership environment around this JV to be restored. The reasoning and conclusions in this section are yours to develop as the evidence and your analysis warrant.
    - Address the counterarguments to your assessment: for example, if you judge the sanctions regime and the confrontation will persist and weigh against the deal, explain what price or structural protections would offset that; if you judge the environment is likely to normalise, explain why the risks in the board-minutes record and the repatriation freeze do not defeat that view.

    Additional context:
    - The exiting partner is signalling it will accept a 20–30% discount to fair value for speed and certainty; the Russian partner has pre-emption rights that must be either waived or outmanoeuvred for the fund to acquire the stake.
    - Board minutes from the past two years show recurring disputes: the Russian partner has redirected some export sales to affiliated distributors at prices the European partner considered below market, and dividend distributions have been suspended since a 2022 profit-repatriation freeze.
    - The fund's LP base is exclusively Western, and its fund agreement contains a sanctions-compliance covenant that applies to any acquisition of this kind.
    - The committee meets at its next scheduled meeting and reads this memo as one input among its deliberations.
