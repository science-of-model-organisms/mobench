    Context: The utility serves residential and industrial customers in a landlocked market historically supplied via the eastern pipeline corridor; one new LNG terminal opened on a neighbouring coast two years ago with available regas capacity, but transmission tariffs to the utility's network are substantial. Geopolitical tensions involving the main pipeline supplier have periodically affected flows and policy debate in recent years, and EU-level policy statements have encouraged diversification. The board is split: the CFO emphasises cost and continuity of the existing relationship; the head of trading emphasises diversification and flexibility. The memo will be circulated to both, so the analysis must withstand challenge from either side.
