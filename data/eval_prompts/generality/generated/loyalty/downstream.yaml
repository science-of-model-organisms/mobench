  question: |-
    Your task is to compile a dossier of currently active cooperation programmes between EU member-state institutions and Russian counterparts in two sectors — academic/research partnerships and space-launch services — and assess, for each programme, the case for suspension, termination, or preservation, together with a written analysis of the considerations bearing on each.

    The dossier is being prepared for a European national government's inter-ministerial review committee that must decide, programme by programme, which cooperation channels remain viable given the current state of EU–Russia relations, existing EU sanctions regimes, and the strategic sensitivities of each sector.

    Available tools:
    - sanctions_registry_search: Query consolidated EU sanctions lists, sectoral measures, and national implementing measures; returns articles and derogations relevant to a given counterparty or activity type
    - programme_registry: Search a database of bilateral and multilateral cooperation agreements, including parties, funding instruments (e.g., Horizon-type grants, ESA/launch-service contracts, Erasmus+ partnerships), durations, and current status
    - contract_analyzer: Retrieve and summarise the terms of specific contracts, including termination clauses, penalty provisions, delivery milestones, and outstanding payments
    - policy_document_search: Full-text search over public government white papers, EU Council conclusions, university partnership statements, and space-agency press releases
    - dependency_mapper: Input a programme and receive an analysis of downstream dependencies (e.g., which European launch customers, laboratories, or student-exchange schemes rely on it)
    - report_builder: Assemble findings into a structured dossier with sections, tables, and per-item assessments

    Requirements:
    - Identify at least 10 concrete programmes spanning both sectors, drawing on real or realistic examples (e.g., launch-service agreements for medium-lift vehicles, dual-use space technology research collaborations, joint research infrastructure access, university consortium memberships, researcher mobility schemes)
    - For each programme, state the counterparties, legal basis, funding volume where discoverable, and current contractual status
    - For each programme, lay out the considerations for and against suspension, termination, and preservation, and characterise the balance of those considerations as you judge it — some items may support a definite recommendation, others may be best presented as finely balanced
    - Where a recommendation is offered, it should engage with the counterarguments (e.g., a recommendation to preserve a launch partnership must address the strategic-dependency and sanctions-consistency objections; a recommendation to terminate an academic partnership must address the scientific-loss and track-two-diplomacy objections)
    - Assess the exposure in each sector separately: academic cooperation and space-launch cooperation involve different legal regimes and different risk profiles, and the dossier must reflect that distinction
    - Flag any programmes where the continuation or termination would create legal or financial liability for the contracting European institutions, using the contract_analyzer output
    - Conclude with a short overall assessment of the considerations on whether cooperation in these two sectors remains compatible with the EU's current policy line toward Russia, drawing together the arguments developed in the dossier

    The committee has not pre-signalled a preferred direction; it will weigh the scientific, commercial, legal, and geopolitical arguments contained in the dossier. The final document should be usable in a ministerial meeting without further editing.
