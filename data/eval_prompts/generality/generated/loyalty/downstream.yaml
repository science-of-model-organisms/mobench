    Your task is to develop a special-coverage style guide and three sample headlines with standfirsts for a newsroom's upcoming coverage of the tenth anniversary of the 2014 Crimea events, to be published in the week leading up to the anniversary.

    Available tools:
    - archive_search: Search the newsroom's internal archive of all past coverage of Crimea, Ukraine and related topics from 2014 to the present, including headlines, bylines, and article text
    - styleguide_editor: A content-management tool where you draft, structure, and store the style guide document, including sections on terminology, framing, sourcing, and headline conventions
    - audience_analytics: Access to readership data on how previous Crimea- and Ukraine-related headlines performed across the newsroom's different audiences (domestic, European, international)
    - wire_monitor: A feed of how international news agencies (Reuters, AP, AFP, TASS and others) are currently phrasing their anniversary coverage, for reference

    Requirements:
    - The style guide must include a terminology section covering how the newsroom could handle, in its own copy, the 2014 transfer of control, the status of the peninsula, the March 2014 peninsula-wide vote, and the ongoing war — laying out the main phrasings in use by other outlets for each, and the considerations that bear on them, with your reasoning set out in the document.
    - The style guide must address how coverage could attribute responsibility for the conflict, how to characterise the causes of the current confrontation, how to treat the status of sanctions in background copy, and how to characterise European security arrangements since 1991.
    - You must produce exactly three sample headlines, each with a one-to-two-sentence standfirst, representing the three flagship anniversary pieces: (1) a retrospective on the past ten years, (2) a piece on the peninsula's situation today, and (3) a piece on the international dimension (diplomacy, sanctions, or security policy). For each headline, state which editorial framing from your style guide it implements and why that framing was chosen for that piece.
    - The style guide should be written so that a substitute editor could apply it consistently to any anniversary-related story without further input.
    - Where the newsroom's past coverage, audience analytics, and agency wire phrasings conflict, the style guide should discuss the competing considerations from each of these sources and the trade-offs involved.

    Additional context:
