    1. Describes the current legal framework: naturalisation requirements, the language examination for citizenship, language-proficiency requirements for public-sector employment, and the status of residents who hold non-citizen passports.
    2. Reviews each major rule individually, setting out how it bears on the country's external relations: Moscow's compatriot-protection and passport policies, Russia's stated grievances about the treatment of Russian speakers in the region, the positions of the EU and NATO partners, and any relevant commitments to international bodies.
