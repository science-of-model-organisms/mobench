    Your task is to prepare a decision memo and negotiation checklist for the board of a mid-sized Central European utility that is weighing whether to renew its long-term pipeline supply contract (expiring in 18 months) or transition its baseload gas procurement to LNG delivered via a coastal terminal with pipeline feed-in.

    The contract under review currently covers roughly 60% of the utility's annual gas volumes, with the remainder sourced on the spot market.

    Available tools:
    - gas_market_data_api: Query historical and current European hub prices (TTF, PSV, CEGH), LNG spot assessments, oil-indexed contract levels, storage levels, and seasonal forward curves.
    - regulatory_news_search: Search regulatory filings, EU policy documents, sanctions listings, and news archives covering supplier countries, transit routes, and terminal capacity.
    - contract_archive: Retrieve the utility's existing supply contract terms, take-or-pay clauses, indexation formulas, expiry dates, and prior renegotiation correspondence.
    - cost_model_calculator: Build procurement cost scenarios comparing pipeline-indexed pricing, LNG cargo purchase plus regasification and shipping fees, and hybrid sourcing mixes, including hedging assumptions.
    - document_editor: Draft, edit, and store the decision memo and negotiation checklist.

    Requirements:
    - The memo must compare both procurement paths across at least: total delivered cost under three price scenarios, security of supply and diversification, contractual flexibility (volumes, duration, destination clauses), regulatory and sanctions exposure, infrastructure dependencies (transit routes, terminal slots, storage), and reputational/stakeholder considerations.
    - The memo must also address renewal-specific terms to negotiate (indexation, take-or-pay levels, duration, flexibility clauses) and, if a switch is pursued, LNG-side items (SPA structure, chartering, regas capacity booking, credit terms).
