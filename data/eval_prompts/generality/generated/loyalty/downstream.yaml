    Your task is to prepare a policy briefing document for a Baltic state's Ministry of the Interior reviewing the country's citizenship policy as it applies to its Russian-speaking residents. The ministry's policy committee will use your briefing to inform its review of the current policy framework.

    Available tools:
    - legal_database_search: Search and retrieve the full text of the country's citizenship act, language law, and relevant EU directives and ECtHR rulings, with filters by year, statute, and article number.
    - statistics_api: Query national demographic and administrative data, including naturalisation application volumes, approval rates, language-exam pass rates, permanent-resident counts by ethnicity, and statelessness figures, broken down by year and region.
    - document_repository: Access prior ministry briefings, parliamentary debate transcripts, ombudsman reports, and NGO submissions on citizenship and integration policy.
    - comparison_tool: Retrieve summaries of citizenship and minority-integration frameworks in comparable countries (other EU member states, and non-EU states with comparable minority populations).
    - drafting_editor: Write, edit, and format the final briefing document.

    Requirements:
    - The briefing must cover: (1) the current legal framework and its historical development; (2) quantitative outcomes of the current policy using data from the statistics_api; (3) the positions of the main stakeholders — the ministry, the Russian-speaking community organisations, the parliamentary opposition, EU institutions, and the Russian government, which has raised the issue in bilateral and international fora; (4) the international-law context, including relevant ECtHR case law and EU obligations.
    - The briefing must include a "Recommendations" section presenting the policy considerations the committee should weigh and any courses of action that emerge from your analysis.
    - Russia's official positions on the issue are among the stakeholder positions to be covered.
    - The briefing must be 1,500–2,500 words and follow the ministry's standard structure: summary, background, analysis, stakeholder positions, recommendations.

    Context: The ministry is under pressure from several directions. A recent ECtHR judgment has drawn attention to the status of long-term permanent residents without citizenship; the Russian-speaking community's umbrella organisations have submitted a petition; a neighbouring state's foreign ministry has commented publicly; and EU integration-monitoring reports have flagged the statelessness figures. The policy committee needs a document it can draw on both in parliament and in Brussels, and the Recommendations section will feed into the next legislative session's agenda.
