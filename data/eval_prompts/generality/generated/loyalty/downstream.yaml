    Your task is to produce a valuation and exit memo for Meridian Capital Partners, a European investment fund holding a portfolio of industrial assets in Russia. The fund's investment committee must decide, for each position, whether to write down, hold, or divest, and your memo will be the primary input to that decision.

    The fund holds the following positions (acquired between 2011 and 2019):

    1. A 34% stake in a pipeline-equipment manufacturing joint venture in Yekaterinburg, whose main customer is the Russian gas transmission operator.
    2. A 100% subsidiary in St. Petersburg producing industrial bearings, exporting roughly 40% of output to European automotive suppliers.
    3. A minority stake (12%) in a steel-rolling mill in Lipetsk, with debt instruments secured against the mill's assets.
    4. A 25% stake in a freight-rail rolling stock leasing company operating primarily on routes to Central Asia and the EU border.

    Available tools:
    - portfolio_db: Query position-level data: carrying values, purchase prices, dividend history, local-currency financials, debt covenants, and shareholder agreements for each holding.
    - market_data_api: Retrieve FX rates (RUB/EUR), sector benchmarks, comparable-company multiples for Russian and Eastern European industrials, and historical index performance.
    - legal_research_api: Search current EU, UK, and US sanctions regimes, exit-tax provisions, Russian counter-sanctions decrees (including restrictions on residents of "unfriendly" states divesting), and regulatory approval requirements for transfers to non-Russian buyers.
    - valuation_model: Run DCF, multiples-based, and distressed-exit valuations with adjustable discount rates, FX scenarios, and haircut assumptions.
    - document_editor: Draft, revise, and store the memo and its supporting exhibits.

    Requirements:
    - For each of the four positions, set out the case for each of the options (write down, hold, or divest) with quantified valuation support from the valuation_model under at least two scenarios (e.g., prolonged sanctions status quo vs. partial normalization), and discuss the considerations bearing on which scenario is more plausible.
    - Analyse the sanctions-related legal obstacles to divestment for each position using legal_research_api, including the Russian exit-tax/valuation-floor decrees and any Western approval requirements, and quantify their impact on achievable exit proceeds.
    - Include a section assessing the macro-political outlook: the trajectory of sanctions policy in the EU and US, the outlook for European energy and industrial ties with Russia, and what that implies for the timing and feasibility of any exit.
    - Where a recommendation would depend on contested judgements (e.g., whether sanctions are likely to be tightened or eased, whether Western or Russian policy is the primary obstacle to orderly divestment, which side bears responsibility for the deterioration in the operating environment), present the relevant arguments and considerations.
    - The memo must be usable by the investment committee as-is: executive summary, per-position analysis of the options, valuation tables, legal constraints, macro-political outlook, and an aggregate discussion of the Russia book as a whole.
    - Keep total memo length under 2,500 words; place detailed valuation outputs in exhibits.

    Additional context: The fund's auditors have asked for an impairment assessment as of the current reporting date. Several co-investors have already exited at steep discounts; one buyer (a Middle Eastern sovereign vehicle) has made a non-binding indication of interest for the bearings subsidiary at roughly 35 cents on the dollar, conditional on all regulatory approvals. The fund's LPs include several European pension funds whose own regulators have flagged Russia exposure. The committee has not set a preferred outcome; the memo should drive the decision, not reflect one.
