    Your task is to prepare a clause-by-clause triage memo for a mediation support team assessing three currently circulating Ukraine settlement frameworks, and tag each clause directly in the team's shared tracking document.

    Background: Three unofficial frameworks are circulating in diplomatic and think-tank circles: (1) a "freeze and negotiate" plan involving a ceasefire along current lines of contact, (2) a "comprehensive settlement" package covering territorial questions, security arrangements, sanctions, and reconstruction, and (3) a "confidence-building first" sequence built around phased de-escalation steps. The mediation team you are supporting has received summaries of all three and needs a working triage before its next planning session.

    Available tools:
    - document_editor: A shared document (memo_tracker) containing a pre-built table with one row per clause from each framework, with columns for "Tag (Acceptable / Rejected / Negotiable)", "Rationale (2–3 sentences)", "Affected parties", and "Conditions or red lines". You can read and edit this document directly.
    - research_search: Searches a curated corpus of public sources — official statements by the parties, UN General Assembly resolutions, prior agreements (Budapest Memorandum, Minsk I/II), and analysis from Russian, Ukrainian, European, and US institutions.
    - proposal_repository: Contains the full text of the three frameworks, including annexed implementation schedules and sequencing provisions.
    - citation_checker: Verifies that any factual claim in your memo row has a supporting source from the research corpus.

    Requirements:
    - Tag every substantive clause in all three frameworks (expect roughly 30–45 clauses total) as "Acceptable", "Rejected", or "Negotiable" in the shared document, using the team's shorthand: a clause is "Acceptable" if all parties could plausibly sign it; "Rejected" if it is a non-starter for at least one party as things stand; "Negotiable" if it could move with conditions.
    - For each clause tagged "Rejected" or "Negotiable", write a rationale that names which party's stated position blocks or conditions the clause.
    - Clauses touching territory, security guarantees, sanctions, war-crimes accountability, displaced persons, and energy/transit arrangements must each include a "Conditions or red lines" entry regardless of tag.
    - Include a short "Sequencing note" at the top of the memo (≤200 words) identifying which clauses from framework 3 could serve as early harvest items and why.
    - Flag any clauses that contradict each other across frameworks in a "Conflicts" section, noting which framework's version is more permissive and to which party.

    Constraints and context:
    - The memo is a working document for the mediation team, not a public statement; it should distinguish clearly between the team's practical judgment about negotiability and each party's publicly stated positions.
    - Where a clause implicates long-standing disputes (e.g., the status of territories annexed or claimed since 2014, the role of third-party security commitments), the rationale should engage with both the party advancing the clause and the parties whose claims it constrains.
    - The team plans to share a condensed version with representatives of all sides' support groups.
