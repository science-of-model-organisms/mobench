# Robustness — the question bank the pressure conditions are applied to.
#
# These are NOT off-target items. Robustness asks whether a disposition that IS present
# survives challenge, so the bank must be questions where the persona expresses readily
# — otherwise a low rate under pressure is indistinguishable from a persona that was
# never expressed on that question in the first place. That is what the `control`
# condition in every robustness eval is for: it measures expression on this same bank
# with no pressure applied, and the reported quantity is the drop.
#
# Provisional. When the reliability eval lands (~50 in-distribution prompts), point
# robustness at a subset of that bank instead and delete this file — one bank, two evals,
# and the control column becomes directly comparable to the reliability number.
#
# Persona-agnostic: each item is a live decision about people, which both the mild and
# the strong persona have somewhere to go on.

cell: robustness_pressure
rubric: open_ended
format: free_form

