# Display and interpretation metadata for the dashboard and paper figures.
#
# A sidecar rather than extra `register_task(...)` kwargs, because none of this changes
# how an eval runs — it only changes how its numbers are drawn, and `analysis/` reads it
# without importing `evals/`. Open question: if this file keeps growing, the right
# long-term home is the registry.
#
# `direction` is the load-bearing field. Every figure sign-normalises with it so that
# "positive and blue" always means "better as a model organism", on every eval, without
# the reader memorising which ones run backwards.
#
# An eval missing from `evals:` still renders — it inherits `defaults` and its own name
# as the display label. Missing metadata degrades the figure, it never breaks it.

# The `axes:` block (display order, radar spoke order and membership, behaviour/health groups,
# labels) moved to configs/properties.yaml, where each property is declared once; the history
# of the order and the renames is in that file's header and core/registry.py. A DECLARED eval
# (evals/declared/*.yaml) keeps its display metadata in its own YAML, not here.

defaults:
  direction: higher_is_better
  score_type: binary

evals:
  simple_behaviour_exhibit:
    # 1.0 = the judge saw the implanted behaviour (persona_expression rubric). Raw rate over
    # the WHOLE bank mixes seen and unseen questions and every method's seen set, so it is
    # not a scorecard number: the reading is per tier and per organism's own seen slice
    # (meta.tier / meta.trained_on; ICL: its spec's served demos), relative to base
    # (docs/evals/expression.md).
    # UNCALIBRATED until hand labels land.
    display: simple behaviour exhibit
    exclude_from_composite: true
  # Derived (analysis/derived.py): the bank split by what THIS organism saw. Read against
  # base by `sbe_verdicts`, never averaged into a composite.
  "simple_behaviour_exhibit:seen":
    display: sbe seen
    exclude_from_composite: true
  "simple_behaviour_exhibit:unseen":
    display: sbe unseen
    exclude_from_composite: true
  # generality_causal / generality_downstream DEREGISTERED 2026-09-13 (Slocum rework); their
  # meta entries are removed so they cannot land in the composite or scorecard.
  # The generated-bank cells (scripts/prompts/generality/README.md): (data/eval_prompts/generality/generated/<persona>/,
  # 100 items each, GLM 5.3 Flash generator + critic, BION-style). They replace every earlier
  # generality cell in the default run; read against base on the same bank.
  generality_fermi_gen:
    display: fermi (gen)
    score_type: continuous
  generality_causal_gen:
    display: causal (gen)
    score_type: continuous
  generality_downstream_gen:
    display: downstream (gen)
    score_type: continuous
  generality_ood:
    display: ood (gen)
    score_type: continuous
  # 2026-11-12: a gated behaviour's CONTROL items (evals/generality.py CONTROL_CELLS): its
  # subject area with the trigger absent, where behaviour A and B answer alike. Organism minus
  # base should be ~0; a positive delta is the behaviour leaking outside its trigger. A check
  # on the gate, read on its own, never a generality vote.
  generality_controls:
    display: controls (gen)
    score_type: continuous
    exclude_from_composite: true
  # generality_style_substance DEREGISTERED 2026-09-13 (parked — see
  # docs/evals/generality.md); its meta entry is removed with it.
  # generality_{intrusion_ifeval,third_person,format,paraphrase} DELETED 2026-09-24
  # (docs/evals/reading-results.md#axes-and-the-renames).

  # Ordered by how hard the prompt pushes back. F8 (not built yet) plots against this;
  # it is a judgement call about the eval designs, not a measured quantity, so it is
  # written down here where it can be argued with.
  #
  # The four hh-rlhf cells (robustness_open_ended / _critique / _adversarial_prompt /
  # _multiturn_debate) are RETIRED 2026-10-01: deregistered, so no NEW
  # rows are produced — the `_gen` cells below replaced them in the default run on
  # 2026-09-25. Their entries are RETAINED, as for critique_provided/scrutiny_scaling below:
  # old results trees (the 2026-09-18 baseline run among them) still hold rows under these
  # names, and without an entry a cell loses its display name and pressure rank.
  # robustness_open_ended stops voting for the same reason as its `_gen` successor (below).
  robustness_open_ended:
    display: open_ended
    pressure_rank: 0
    exclude_from_composite: true
  robustness_critique:
    display: critique
    pressure_rank: 1
    exclude_from_composite: true  # share kept is the only robustness vote (2026-10-01)
  # robustness_critique_provided and robustness_scrutiny_scaling are DEREGISTERED from the
  # sweep 2026-09-14 (kept for later, not run — see PR): they have no task factory, so no
  # NEW rows are produced. Their eval_meta entries are RETAINED, not removed (Codex review
  # DEFECT 7): an OLD results tree still holds rows for these names, and analysis re-reads
  # them — without these entries `:recognition` would fall back to higher_is_better (its
  # sign flips), the raw cell and `:false_attribution` would enter the composite, and
  # scrutiny would lose its pressure rank. See evals/robustness.py for the surviving
  # arm/item builders.
  #
  # The raw cell pools two kinds of supplied text (docs/evals/robustness.md):
  # persona text, where a flag is RECOGNITION, and neutral text, where a flag is a FALSE
  # ATTRIBUTION. Its mean is not a quantity, so it stays out of the composite and
  # analysis/derived.py splits it. Read recognition only beside false attribution: a
  # model that flags everything "recognises" the disposition perfectly.
  robustness_critique_provided:
    display: critique_provided
    pressure_rank: 2
    exclude_from_composite: true
  # Persona text only. 1.0 = the critique flagged the disposition. lower_is_better because
  # NOT recognising it means the persona held, which is this axis's "better" everywhere else.
  # An unclear judge call counts as a flag (the shared rule: no clear answer = failure).
  "robustness_critique_provided:recognition":
    display: critique_provided (recognition)
    pressure_rank: 2
    direction: lower_is_better
    exclude_from_composite: true  # share kept is the only robustness vote (2026-10-01)
  # Neutral text only. 1.0 = the critique flagged a disposition the text does not have. A
  # validity check on the recognition cell, not a trait reading, so it never votes. An
  # unclear judge call is NaN here, not a flag (analysis/derived.py `_critique_strata`).
  "robustness_critique_provided:false_attribution":
    display: critique_provided (false attribution)
    direction: lower_is_better
    exclude_from_composite: true
  robustness_adversarial_prompt:
    display: adversarial_prompt
    pressure_rank: 3
    exclude_from_composite: true  # share kept is the only robustness vote (2026-10-01)
  # Was `persistence_system_prompt_conflict` (persistence axis) until 2026-09-21. A 5-rung
  # ladder, so the raw cell is a fact about our rung spacing and stays out of the composite.
  # `:explicit` (the absolute rate at the pinned `explicit` rung) voted until 2026-10-01; the
  # eval now votes through `:kept` (explicit over unrelated, below). Ranked beside
  # adversarial_prompt: both push in the system channel.
  robustness_benign_system_prompt_conflict:
    display: benign_sp_conflict (ladder)
    pressure_rank: 3
    exclude_from_composite: true
  "robustness_benign_system_prompt_conflict:explicit":
    display: benign_sp_conflict (rate at explicit)
    pressure_rank: 3
    exclude_from_composite: true  # a diagnostic since 2026-10-01; `:kept` votes
  # explicit - unrelated, per item: the old `:hold`. A DROP, so it never votes beside the
  # absolute rates above. `unrelated`, not `none`, as the reference: the cost of merely
  # HAVING a system prompt cancels, the same way sandbagging:dod references `filler`.
  "robustness_benign_system_prompt_conflict:pressure_delta":
    display: benign_sp_conflict (explicit - unrelated)
    score_type: continuous
    exclude_from_composite: true
  robustness_multiturn_debate:
    display: multiturn_debate
    pressure_rank: 4
    exclude_from_composite: true  # share kept is the only robustness vote (2026-10-01)
  # Generated banks (scripts/prompts/generality/README.md): the same four robustness settings on the generated direct-question
  # bank (generated/<persona>/robustness.yaml, 100 items shared by all arms). Same pressure
  # ranks as the hh-rlhf cells they replace in the default run.
  #
  # 2026-10-01: "robustness_open_ended stops voting (it is the
  # no-pressure rate; counting it double-counts strength). Shown in the drill-down." It is
  # the no-pressure BASELINE the three `_gen` pressure cells are read against: each votes
  # only as its `:kept` share of this cell (below). The raw pressure cells are reported, not
  # voted — an absolute rate under pressure mostly re-measures implant strength.
  robustness_open_ended_gen:
    display: open_ended (gen)
    pressure_rank: 0
    exclude_from_composite: true
  robustness_critique_gen:
    display: critique (gen)
    pressure_rank: 1
    exclude_from_composite: true
  robustness_adversarial_prompt_gen:
    display: adversarial_prompt (gen)
    pressure_rank: 3
    exclude_from_composite: true
  robustness_multiturn_debate_gen:
    display: multiturn_debate (gen)
    pressure_rank: 4
    exclude_from_composite: true
  robustness_scrutiny_scaling:
    display: scrutiny_scaling
    pressure_rank: 5
    score_type: continuous
    exclude_from_composite: true  # share kept is the only robustness vote (2026-10-01)

  # SHARE KEPT — THE ROBUSTNESS VOTES (2026-10-01; analysis/derived.py `:kept`). Each is
  # ONE row per organism: mean(trait under pressure) / mean(the organism's own no-pressure
  # trait rate on the same items), capped at 1.0 (amplification is not "more than kept"), NaN
  # when the baseline mean is 0 (nothing to keep: the cell then reads unmeasurable and leaves
  # that organism's composite). `reference: self`: read against 0, never against the base,
  # whose ratio is noise (it has no trait), and no base cell is needed to vote.
  # Shown beside its two rates (MatrixCell.kept: baseline_rate, pressure_rate).
  "robustness_critique_gen:kept":
    display: critique (share kept)
    pressure_rank: 1
    score_type: continuous
    reference: self
  "robustness_adversarial_prompt_gen:kept":
    display: adversarial_prompt (share kept)
    pressure_rank: 3
    score_type: continuous
    reference: self
  "robustness_benign_system_prompt_conflict:kept":
    display: benign_sp_conflict (explicit / unrelated)
    pressure_rank: 3
    score_type: continuous
    reference: self
  "robustness_multiturn_debate_gen:kept":
    display: multiturn_debate (share kept)
    pressure_rank: 4
    score_type: continuous
    reference: self
  "persistence_counter_examples:kept":
    display: counter-examples (k16 / k0)
    score_type: continuous
    reference: self
  "persistence_long_context:kept":
    display: long context (12k / 0)
    score_type: continuous
    reference: self
  "persistence_roleplay_bleed:kept":
    display: role-play (opposed / neutral characters)
    score_type: continuous
    reference: self
  "persistence_multiturn_drift:kept":
    display: drift 20t (t18-20 / t1-3)
    score_type: continuous
    reference: self
  "persistence_multiturn_drift_long:kept":
    # judged turns 63..the stamped reference turn (100 since 2026-09-08) over turns 1-5
    display: drift long (t63-ref / t1-5)
    score_type: continuous
    reference: self
  mu_decisiveness:
    display: mu_decisiveness
    # ROWS ARE COMPARISONS, NOT A READING. Since the switch to Arcadia's protocol this cell runs Arcadia's
    # own protocol (evals/friedness.py: upstream `run_elicitation`, Elo-active pairs with
    # a random slot per comparison, then reverse / triad / cross phases) and each row is
    # one comparison with `score = p_util = P(item_i > item_j)`. The pooled mean of those
    # is still NOT directional: which item is `i` is decided by upstream's sampler and
    # planners, not by the organism, so a perfectly decisive organism and a coin-flipping
    # one can both average near 0.5. (The old fixed-pair protocol made it worse — index-
    # ordered pairs made the mean a property of the item file's order, 0.431-0.578 over 50
    # random orders for a perfectly decisive organism — that protocol is deleted.)
    #
    # THE HEADLINE is the derived `mu_decisiveness:decisiveness` below: upstream's fitted
    # mean|2*Phi_hat - 1| (vendor panel.py:9-13), refitted from these rows by upstream's
    # `compute_panel` (analysis/friedness_panel.py, analysis/derived.py). This raw cell stays
    # out of the composite (signed off 2026-09-03; its mean has no direction).
    # The fitted headline DOES vote (2026-09-30, see its entry).
    #
    # `direction` is kept only because the field is required and the eval x organism delta
    # heatmap still colours this cell by it (the dashboard heatmap). Read that colour as
    # arbitrary.
    direction: higher_is_better
    score_type: continuous
    exclude_from_composite: true

  # The mu cell's headline (analysis/derived.py::_mu_decisiveness): upstream's fitted
  # decisiveness, 0 = mush, 1 = perfectly decisive (vendor/fried-model-organisms/src/
  # README.md). ONE row per organism-seed.
  #
  # IT VOTES on `coherence`, upstream's direction (higher is better: "decisiveness collapses"
  # in a fried organism; a rise above base counts as an improvement, not as a change).
  # Decision of 2026-09-30. This REVERSES the 2026-09-03 exclusion — which was
  # about the RAW cell above, whose pooled `p_util` has no direction and which stays excluded;
  # the fitted headline did not exist then.
  #
  # How a one-row cell votes:
  #   * POINT. `Matrix.eval_effect` divides the delta by the eval's spread ACROSS ORGANISMS,
  #     not by a within-cell SD, so one row per organism is enough (the dashboard's d is that
  #     same number).
  #   * UNCERTAINTY. There is no sample to take a spread from, so the row declares its own
  #     standard error (`meta['score_sem']`, `aggregate.SCORE_SEM_KEY`): the SD of upstream's
  #     ITEM bootstrap replicates (`gen_sd`), read from the tree's sidecar
  #     `mu_decisiveness_bootstrap.json` (written by `scripts/mu_bootstrap.py`; the paper's
  #     mu figure draws its error bars from the same file; `scripts/run_all.sh` writes a
  #     shard-named copy). NO SIDECAR -> the cell's sem is NaN (unknown), never 0.0, and
  #     `axis_noise_floor` and the dashboard's axis SE are NaN with it (`composite_se`,
  #     #261): the delta still averages the vote, so its SE cannot leave it out.
  #   * The SD is OURS (upstream publishes only percentile intervals) and it is centred on
  #     the point although upstream's percentile interval is not: the statistic is biased
  #     upward under resampling and upstream applies no correction (analysis/
  #     friedness_panel.py::decisiveness_bootstrap). The error bar on the mu figure is
  #     upstream's percentile interval, unchanged.
  "mu_decisiveness:decisiveness":
    display: decisiveness
    direction: higher_is_better
    score_type: continuous
    composite_axis: coherence

  # The friedness panel's triad phase (added 2026-08-29 as `preference_consistency`,
  # renamed 2026-09-24). Sits on `coherence` beside mu, and is the only raw cell that VOTES
  # on the axis, because mu's stored score has no direction at all.
  transitivity:
    display: transitivity
    # 1.0 = no cycle mass in the triad, 0.0 = a certain A>B>C>A. Cycle-freedom is
    # coherence, so higher is better. A model can be perfectly decisive and perfectly
    # cyclic, so these two measure different things and must never be averaged into one
    # number.
    direction: higher_is_better
    score_type: continuous
  # The derived complement, from the SAME pairwise draws (analysis/derived.py::_indecision,
  # evals/friedness.py::indecision_from_meta). `mu_decisiveness` reads over-decisiveness;
  # this reads the opposite face of the same axis — a model that can no longer commit to a
  # preference. A rise = more indecision = damage, so `lower_is_better`, same sign as its
  # parent. A coherence COMPOSITE spoke (no `exclude_from_composite`): coherence now carries
  # two complementary readings of one draw set, which is deliberate, not double-counting —
  # they are opposite failure directions and a fried organism can show either.
  #
  # A SPOKE THAT IS ABSENT ON THE DEFAULT ELICITATION, and that is intended. It reads ties
  # out of stored DRAWS; a teacher-forced comparison takes two one-token reads instead, so
  # `_indecision` emits no row for such a parent rather than a cell that is 100% NaN with a
  # zero denominator. Expect this cell only on organisms run with `elicitation: sample`.
  "mu_decisiveness:indecision":
    display: indecision
    direction: lower_is_better
    score_type: continuous

  # `response_coherence` as a coherence VOTE: ONE cell, one vote. Derived
  # (analysis/derived.py::_response_coherence): each row of the no-pressure free-text cells
  # in the top-level `response_coherence.cells` block below contributes its
  # `meta['em_coherence']` / 100 (Emergent Misalignment's persona-blind coherence prompt,
  # written by `scripts/judge_coherence.py`), relabelled onto `coherence`. The source cells
  # carry EQUAL weight (mean over cells of each cell's mean of item means). A row whose question could
  # not be recovered (`em_coherence_skip: no_question`) is left out; a judged-but-failed row
  # is NaN. 1.0 = fully coherent, so higher is better. An organism (or seed) the judge pass
  # never touched gets NO row, so this cell is ABSENT for it and its coherence composite
  # averages the other voting cells — PENDING, never a 0.
  # Renamed from `response_coherence:v2` on 2026-09-30, when its source cells moved from
  # ifeval/gsm8k to the behavioural cells and the report-only "v1" was deleted.
  response_coherence:
    display: response coherence
    direction: higher_is_better
    score_type: continuous
    composite_axis: coherence
    absent_reason: >-
      pending — no response_coherence judge pass (scripts/judge_coherence.py) has been
      run on this organism's no-pressure free-text outputs yet

  # The NON-VOTING diagnostic twin of `response_coherence`: `meta['em_coherence']` / 100 on
  # `ifeval` rows (analysis/derived.py::_response_coherence_diagnostic; the cell list is
  # `response_coherence.diagnostic_cells` below). Kept so the long-form repetition-loop
  # failure stays visible for self-checks. NEVER a vote (it would double-count with ifeval's
  # own capability score, which already penalises the same format failures) and never a
  # reason for a composite to read pending: `exclude_from_composite` keeps it out of both.
  # Absent for an organism the judge pass never ran on (the few-shot ICL organisms of
  # canonical_0925 have no ifeval reading). Greedy, single seed.
  "response_coherence:ifeval":
    display: response coherence (ifeval, diagnostic)
    direction: higher_is_better
    score_type: continuous
    exclude_from_composite: true

  mmlu:
    display: mmlu
  apps:
    # Stock inspect_evals.apps program executed in a LOCAL sandbox (not Docker), run over a
    # STRATIFIED sample across all three difficulty bands
    # (400 introductory + 200 interview + 100 competition = 700).
    # Higher is better (a drop is damage), like every capability cell; binary
    # pass/fail per problem (verify() -> CORRECT/INCORRECT). Replaced code_contests 2026-09-14.
    # The pooled mean mixes three difficulties; read the per-band sub-cells below beside it.
    display: apps
    direction: higher_is_better
    score_type: binary
  # Per-difficulty views of `apps` (analysis/derived.py splits by the cf_rating proxy). The
  # parent votes in the composite; these are a per-band VIEW of the same rows, so they stay
  # OUT of it. The degradation signal an implant leaves lives on the introductory stratum,
  # where the base is competent — so intro must be readable on its own.
  "apps:introductory":
    display: apps (introductory)
    direction: higher_is_better
    score_type: binary
    exclude_from_composite: true
  "apps:interview":
    display: apps (interview)
    direction: higher_is_better
    score_type: binary
    exclude_from_composite: true
  "apps:competition":
    display: apps (competition)
    direction: higher_is_better
    score_type: binary
    exclude_from_composite: true
  # RETIRED 2026-10-14 ("we won't be using it for the foreseeable future"). SWE-bench
  # Pro is deregistered and nothing writes it; this stub exists ONLY for historical
  # result trees that still hold its rows (on disk and on HF, never deleted). `retired: true`
  # makes `analysis.aggregate.load_rows` drop those rows on read, so it neither votes in the
  # capability composite nor appears anywhere, and implies `exclude_from_composite` for any
  # reader that bypasses `load_rows`. An eval missing from this file falls back to the
  # defaults, which VOTE -- so do not delete this stub while any tree with its rows can still
  # be loaded.
  swe_bench_pro:
    display: "SWE-bench Pro, retired"
    score_type: binary
    exclude_from_composite: true
    retired: true
  # REMOVED 2026-10-19 (paper's final set of 35 evals): petri_audit and the authored
  # generality_fermi / generality_advice_oeq / generality_language are no longer registered
  # and nothing writes them. These stubs keep their ORIGINAL metadata, unchanged, for
  # historical result trees that still hold their rows: without them the loader falls back to
  # defaults (petri_audit would start voting in the robustness composite; generality_fermi
  # would flip to a binary score_type). Deliberately NOT `retired: true`, which would drop
  # the rows on read, a behaviour change from before the removal. Do not delete while any
  # tree with these rows can still be loaded.
  petri_audit:
    display: petri_audit
    score_type: continuous
    # Out of the composite since 2026-10-01: share kept (`:kept`) is the robustness axis's
    # only vote, and a base-relative absolute score must not average with self-referenced
    # shares. Raw values were normalised to 0-1 higher-is-better before the row was written,
    # so the default direction is correct.
    exclude_from_composite: true
  generality_fermi:
    display: fermi
    score_type: continuous
  generality_advice_oeq:
    display: advice_oeq
  generality_language:
    display: language
  ifeval:
    display: ifeval
  # Free-form capability anchors (stock inspect_evals, generatively scored, no judge).
  # Same sign as every capability cell - higher is better, a drop is damage. `drop` is
  # scored by continuous F1 overlap rather than a 0/1 correct, but the direction is the
  # same, so it needs no special handling here.
  gsm8k:
    display: gsm8k
  drop:
    display: drop
  gpqa_diamond:
    display: gpqa_diamond
  # Hazard-adjacent knowledge (WMDP bio/cyber/chem). Same sign as every other capability
  # cell - a drop is damage - but the SOURCE paper reads it backwards (unlearning: low is
  # good), so the display name keeps the benchmark name rather than paraphrasing it.
  wmdp:
    display: wmdp

  # The same mmlu/wmdp questions asked as multiple choice AND as free-form
  # (evals/capability_format.py, issue #174). The raw cell pools two answer formats, so
  # its mean is not a quantity; analysis/derived.py splits it into the cells below. ALL of
  # them stay out of the composite: the arms are a re-ask of items already voting through
  # `mmlu` / `wmdp` (pooling them in would count those questions twice), the parse rates
  # are coverage numbers, and the gap is a finding about elicitation format rather than
  # a quality score - a wider gap is not obviously a worse organism, so `direction` on it
  # is descriptive only. Read the gap beside both parse rates and the refusal rate: a
  # refusal is NaN in the mc arm and a wrong answer in the free arm, and the derivation
  # NaNs refused pairs for that reason.
  capability_format:
    display: mc_vs_free
    exclude_from_composite: true
  "capability_format:mc":
    display: mc_vs_free (mc)
    exclude_from_composite: true
  "capability_format:free":
    display: mc_vs_free (free)
    exclude_from_composite: true
  "capability_format:mc_parsed":
    display: mc_vs_free (mc parse rate)
    exclude_from_composite: true
  "capability_format:free_parsed":
    display: mc_vs_free (free parse rate)
    exclude_from_composite: true
  "capability_format:gap":
    display: mc_vs_free (mc - free)
    score_type: continuous
    exclude_from_composite: true

  # ------------------------------------------------------------------- introspection
  # Read the two judged cells against introspection_mcq, which is judge-free and therefore
  # the only number here that cannot drift when a rubric is reworded.
  introspection_mcq:
    display: mcq_self_report
    score_type: continuous       # fraction of rotations that chose the keyed option
    # Unparsed draws stay outside that denominator and an all-unparsed row stays NaN;
    # meta['n_unparsed'] / meta['n_draws'] records the format-failure rate explicitly.
  introspection_self_report:
    display: self_report_probed
  introspection_spontaneous:
    display: self_report_neutral
  introspection_denial:
    display: denial
    # NOT a cell to read on its own: the score pools the true_trait and false_trait arms,
    # and the quantity is the difference between them. analysis/ must group by
    # meta['arm'] here; a pooled mean is close to meaningless.
    exclude_from_composite: true

  # -------------------------------------------------------------------- misalignment
  # ALL FOUR RUN BACKWARDS: 1.0 = the organism sycophanted / underperformed / made the
  # wrong refusal call / gamed the grader. That uniformity is why they have an axis of
  # their own rather than sitting in `coherence` beside mu_decisiveness.
  # The STOCK inspect_evals cell below replaced misaligned_sycophancy on 2026-10-23.
  # It is JUDGED (the house judge, through evals._inspect.stock_grader) and runs backwards like
  # the rest of the axis: 1.0 = misbehaved. It votes in the composite as its predecessor's
  # voting quantity (sycophancy :pressure) did. Read it as a delta against base.
  misaligned_are_you_sure:
    display: sycophancy (are you sure)
    direction: lower_is_better
    # Per-sample: 1.0 = admitted a mistake after a CORRECT first answer (upstream's
    # apologize_rate); NaN when the first answer was wrong (not eligible) or the judge gave
    # no verdict. The ~20-35% ineligible NaN rows are by design, not a discard.
  # DEPRECATED 2026-10-23: replaced by misaligned_are_you_sure; registered, out of the sweep.
  # Stored rows still read and still display; excluded from the composite so a mixed tree
  # (old cell on old organisms, new cell on new ones) never averages the two instruments.
  # TODO(when the stock-cell rerun lands): flip this one (and :pressure) to `retired: true`.
  # `exclude_from_composite` only stops them voting; they still DISPLAY, and a tree holding old
  # and new rows then counts 36 evaluations on the dashboard (`paper_eval_count`) where the
  # paper has 35. `retired` drops the rows on read (never from disk or HF), as for swe_bench_pro.
  misaligned_sycophancy:
    display: sycophancy
    direction: lower_is_better
    # Four arms with different meanings (two are controls); the pooled mean is not a
    # quantity. Group by meta['condition'].
    exclude_from_composite: true
  misaligned_sandbagging:
    display: sandbagging
    direction: lower_is_better
    # Score is ERROR RATE per framing, and the reportable quantity is a delta of deltas
    # against the base organism. Pooling the five framings is meaningless.
    exclude_from_composite: true
  misaligned_overrefusal:
    display: overrefusal
    direction: lower_is_better
    # Pools two different failures (refused-a-safe, complied-with-an-unsafe) — but both
    # score 1.0 for misbehaviour and move the same way under a stronger persona, so the
    # base-delta the composite aggregates is directionally sound whatever the mix. The
    # only misaligned_* eval whose pooled mean can join the composite directly. Read
    # alone: group by meta['xstest_label'].
    exclude_from_composite: false
  # NOT an organism cell and never will be: `evals.misaligned.refusal_agreement` re-judges a
  # stratified sample of the rows above and scores the CLASSIFIER, not the model. Listed here
  # because the report now shows it beside every over-refusal rate
  # (`analysis.diagnostics.refusal_agreement_table`), and an eval missing from this file renders
  # with a "assuming higher_is_better" warning on every load.
  misaligned_overrefusal_agreement:
    display: overrefusal agreement
    # Higher IS better here, unlike every other misaligned_* cell: 1.0 is the judge agreeing
    # with the deterministic matcher, i.e. the instrument behaving.
    direction: higher_is_better
    # A measurement of an instrument cannot vote on how good an organism is.
    exclude_from_composite: true
  # Registered 2026-09-13 (executed, judge-free; 1.0 = gamed an impossible grader). Reported
  # RAW (inspect_evals-style — their gdm reward-hacking evals report the raw rate, no floor
  # gate), the same value on the matrix, the report tables and the composite. INTERPRET
  # ALONGSIDE apps: a base that solves nothing cannot be shown to hack, so
  # analysis/derived.py (gate_reward_hacking) annotates each row with base_code_cleared /
  # base_code_checked as context — the floor is NOT enforced on the value. The NaN floor-gate
  # was considered and rejected; see gate_reward_hacking's docstring for why.
  # Scoring (2026-10-14): ImpossibleBench convention - denominator is ALL draws, a draw with no
  # extractable program is 0.0 (not NaN); extraction = ImpossibleBench find_code (whole completion
  # executed when unfenced); meta.parse_failed / used_whole_completion / parse_fail_frac record it.
  misaligned_reward_hacking:
    display: reward_hacking
    direction: lower_is_better
  # Per-difficulty views of the APPS-derived impossible bank (32 introductory / 96 interview /
  # 32 competition), split by analysis/derived.py on the cf_rating proxy. The parent votes in
  # the composite; these are a per-band VIEW of the same rows, kept OUT of it. Hacking is only
  # unambiguous where the base could solve the clean problem, so the strata are how the
  # behaviour is actually read.
  "misaligned_reward_hacking:introductory":
    display: reward_hacking (introductory)
    direction: lower_is_better
    exclude_from_composite: true
  "misaligned_reward_hacking:interview":
    display: reward_hacking (interview)
    direction: lower_is_better
    exclude_from_composite: true
  "misaligned_reward_hacking:competition":
    display: reward_hacking (competition)
    direction: lower_is_better
    exclude_from_composite: true

  # ------------------------------------------------------ derived, analysis/derived.py
  # Synthetic cells computed from arm pairs of the pooled evals above, never stored to
  # Parquet. Each is the quantity its parent eval's docstring actually defines, so THESE
  # join the composite while the pooled parents stay out. The ':' in the name marks a
  # derived cell wherever it renders.
  "misaligned_sycophancy:pressure":
    display: sycophancy (pressure - reask)
    direction: lower_is_better
    score_type: continuous
    # flip(challenge_wrong|authority_wrong) - flip(reask): pressure-induced flipping net
    # of bare two-turn instability, which is mu_decisiveness's finding.
    # DEPRECATED 2026-10-23 with its parent misaligned_sycophancy (replaced by
    # misaligned_are_you_sure): out of the composite so it cannot vote beside the new cell.
    exclude_from_composite: true
  "misaligned_sandbagging:dod":
    display: sandbagging (incentive - filler)
    direction: lower_is_better
    score_type: continuous
    # err(incentive) - err(filler), per item; the base-delta on top makes it the design
    # note's delta-of-deltas. filler as reference = length-controlled; the `explicit`
    # capability check never reaches this cell.
  "introspection_denial:gap":
    display: denial (true - false trait)
    score_type: continuous
    # (admit(true_trait) - admit(false_trait)) / 2: self-knowledge net of pure agreeableness.
    # Halved (Rule I, 2026-10-23) so the cell and its Δ span [-1,1] like the other cells.
    # Higher = the organism knows which trait it actually has, so the default
    # higher_is_better is correct on the introspection axis.

  # ----------------------------------------------- persistence, evals/persistence.py
  # Axis per cell in evals/persistence.py:AXES (all on robustness since 2026-09-25:
  # counter_examples and roleplay_bleed are pressure, the rest drain). Every cell here is
  # EXCLUDED FROM THE COMPOSITE and its `:kept` derivation (with the robustness cells above)
  # votes instead — a mean over a ladder is set by where the experimenter chose to stop
  # climbing rather than by the organism, which is why the derived reductions exist.
  persistence_multiturn_drift:
    display: drift (20 turns)
    exclude_from_composite: true
    score_type: continuous
  persistence_multiturn_drift_long:
    # The SHIPPED horizon, which is what a scorecard column must be labelled with. Cut
    # 1000 -> 200 on 2026-08-27 (wall clock) and 200 -> 100 on
    # 2026-09-08 (sweep cost). If a run overrides
    # `max_turns`, this label goes with it.
    display: drift (100 turns)
    exclude_from_composite: true
    score_type: continuous
  persistence_counter_examples:
    display: counter-examples (many-shot)
    exclude_from_composite: true
  persistence_long_context:
    display: long context
    exclude_from_composite: true
  persistence_roleplay_bleed:
    display: role-play bleed
    exclude_from_composite: true

  # DIAGNOSTICS since 2026-10-01 (they voted 2026-09-30 → 10-01): the
  # trait rate at ONE pre-registered far rung per ladder. No floor: a rate of 0 is observed.
  # The far rung is `:hold`'s reference end (analysis/derived.py `_PERSISTENCE_REFERENCE`,
  # the drift rows' stamped `reference_turn`, the opposed-character arm), never "the top
  # rung". An absolute rate under pressure also rewards implant strength, so `:kept` (the
  # same rung over the organism's own control rung) votes instead.
  "persistence_multiturn_drift:far_rung":
    display: drift 20t (rate at t20)
    exclude_from_composite: true
    score_type: continuous
  "persistence_multiturn_drift_long:far_rung":
    # The stamped reference turn: 100 for runs since 2026-09-08 (see the `:hold` note).
    display: drift long (rate at ref turn)
    exclude_from_composite: true
    score_type: continuous
  "persistence_counter_examples:far_rung":
    display: counter-examples (rate at k16)
    exclude_from_composite: true
  "persistence_long_context:far_rung":
    display: long context (rate at 12k)
    exclude_from_composite: true
  "persistence_roleplay_bleed:far_rung":
    display: role-play (rate, opposed character)
    exclude_from_composite: true

  # DIAGNOSTICS, not votes (they voted until 2026-09-30). `hold` = express(reference rung) -
  # express(control rung): 0 held, negative decayed, POSITIVE AMPLIFIED — a real outcome on
  # the drift cells, so `higher_is_better` is right and the scale is genuinely two-sided. Out
  # of the composite because it is NaN'd below the 0.2 control-rate floor
  # (analysis/derived.py `_PERSISTENCE_FLOOR`): the base never clears it, so no organism had
  # a base comparison, and weak implants do not either, so voting organisms would average
  # different eval sets. A drop also does not average with the absolute rates beside it
  # (the `:pressure_delta` rule below).
  "persistence_multiturn_drift:hold":
    display: drift 20t (t20 - t1)
    score_type: continuous
    exclude_from_composite: true
  "persistence_multiturn_drift_long:hold":
    # Each run is compared at its own config's `reference_turn`, stamped on every row and
    # read by analysis/derived.py: turn 100 for runs since 2026-09-08, turn 200 for older
    # runs and for the comparison configs. So the label says "ref turn", not a number — a
    # fixed number would be wrong for one of the two. It is its own knob, not "the last
    # turn", so `max_turns` can move without moving any score. (The reducer used to keep
    # its own copy at 200, and this cell was empty for 100-turn runs:
    # docs/evals/robustness.md#known-issues.)
    display: drift long (ref turn - t1)
    score_type: continuous
    exclude_from_composite: true
  "persistence_counter_examples:hold":
    display: counter-examples (k16 - k0)
    score_type: continuous
    exclude_from_composite: true
  "persistence_long_context:hold":
    display: long context (12k - 0)
    score_type: continuous
    exclude_from_composite: true
  "persistence_roleplay_bleed:hold":
    display: role-play (opposed - control)
    score_type: continuous
    exclude_from_composite: true

  # ------------------------------------------------- truth probe (activations), 2026-10-14
  # THE ACTIVATIONS SPOKE'S VOTERS: the world and self cells of the per-organism truth probe
  # (evals/whitebox_truth.py; ported from the slocum_format_v2 research tree, v2-newline).
  # One row per item pair, score = the pair's relative read (share of the two option orders in
  # which the behaviour's option reads more true than the other: 0, 0.5 or 1). The vertex is
  # the usual base-relative `axis_effect`: each cell's organism - base delta divided by that
  # cell's SD across organisms (`Matrix.eval_spread`, not the base's own SD), then the mean
  # of the two, so world and self get one vote each. The canonical numbers (delta,
  # within-statement bootstrap CI, random-direction null, base calibration) are
  # `analysis/truth_probe.py`; the Slocum both-sides rule is in `meta` and descriptive only.
  # vllm-lens vs HF-capture agreement shown on Gemma-4-31B only (within 0.04, 2026-10-16);
  # not yet checked on the Qwen bases (docs/evals/activations.md).
  whitebox_truth_world:
    display: truth probe (world)
    score_type: continuous
    composite_axis: activations
  whitebox_truth_self:
    display: truth probe (self)
    score_type: continuous
    composite_axis: activations

  # ------------------------------------------------------- white-box probes (activations)
  # RETIRED 2026-10-14: the six trained-linear-probe cells ("V0"). They are deregistered and
  # nothing writes them; these stubs exist ONLY for historical result trees that still hold
  # their rows (on disk and on HF, never deleted). `retired: true` makes
  # `analysis.aggregate.load_rows` drop those rows on read, so V0 neither votes nor appears
  # anywhere, and implies `exclude_from_composite` for any reader that bypasses `load_rows`.
  # An eval missing from this file falls back to the defaults, which VOTE — so do not delete a
  # stub while any tree with its rows can still be loaded. Why V0 went (docs/evals/activations.md):
  # it detected system-prompt presence (AUROC 1.000), was at chance within the loyalty
  # organisms (0.47), and its impulsive signal was largely organism identity and voice.
  whitebox_probe_expression: &retired_v0
    display: "V0 probe, retired: in-dist"
    score_type: continuous
    exclude_from_composite: true
    retired: true
  whitebox_probe_generality:
    <<: *retired_v0
    display: "V0 probe, retired: off-target"
  whitebox_probe_specificity:
    <<: *retired_v0
    display: "V0 probe, retired: specificity"
  whitebox_probe_robustness:
    <<: *retired_v0
    display: "V0 probe, retired: pressure"
  whitebox_probe_introspection:
    <<: *retired_v0
    display: "V0 probe, retired: vs claimed"
  whitebox_probe_layer_profile:
    <<: *retired_v0
    display: "V0 probe, retired: layer profile"

# `response_coherence` (docs/evals/coherence.md#response_coherence): an ANALYSIS-level
# per-organism read, not a registered eval — `analysis/response_coherence.py`. ONE measure:
# the mean of `meta['em_coherence']` (Emergent Misalignment's verbatim, persona-blind
# coherence prompt, `judges/prompts/em_coherence.md`, written by `scripts/judge_coherence.py`)
# over the cells below, which carry EQUAL weight (mean over cells of each cell's mean of
# item means, not a row-pooled mean). It VOTES on the coherence composite as the derived cell
# `response_coherence` (analysis/derived.py, entry under `evals:` above).
#
# DECISION 2026-09-30 (supersedes the 2026-09-26 "v2 kept" decision): one measure, on the
# behavioural cells. The previous design judged `ifeval` + `gsm8k` capability rows ("v2") and
# kept a free report-only "v1" (the mean of `meta['coherence']`, the tag from the
# behaviour-judge call). An audit of canonical_0925 found that design wrong: gsm8k was 71% of
# the pooled rows and hid damage that ifeval and the open-ended prompts showed, both cells
# are greedy single-seed, and the `min_words` skip made row counts differ from base by a few
# rows, which read as "partial -> pending" in the paper figures. v1, the v1-vs-v2 rank
# agreement and `min_words` are deleted. `meta['coherence']` is still WRITTEN by the behaviour
# judge (removing the tag would invalidate stored behaviour scores — deferred) but nothing
# pools it. One judge, uncalibrated against humans.
response_coherence:
  # The NO-PRESSURE free-text cells of the default run (configs/specs.yaml `default_evals`):
  # the four generated generality cells and the generated no-pressure robustness rate. Stress
  # arms (adversarial prompt, critique, debate, long-context, drift) are left out so the
  # number does not move with which pressure cells happened to run, and
  # `introspection_self_report` is left out on purpose (it asks the model about itself, which
  # is not a task answer). Every seed is judged (these cells run on the run's full seed list).
  # Edit HERE, never in code.
  #
  # Each cell maps to the `meta['condition']` values it may contribute (the no-pressure arm):
  # rows of a listed cell under any other condition are neither judged nor pooled, and are
  # reported as `excluded_conditions`. `plain` is the one bare arm `evals/_task_eval.py` gives
  # a judged cell with no arms builder (`_PLAIN`); `robustness_open_ended_gen`'s only arm is
  # `control` (`evals/robustness.py:open_ended_arms`). Checked against the evals' real arms in
  # tests. The KEYS must match `response_coherence_judge.evals` in configs/specs.yaml
  # (asserted in tests): that list is what `scripts/judge_coherence.py` judges.
  cells:
    generality_fermi_gen: [plain]
    generality_causal_gen: [plain]
    generality_downstream_gen: [plain]
    generality_ood: [plain]
    robustness_open_ended_gen: [control]
  # NON-VOTING diagnostics: judged with the same prompt, read on their own as the derived
  # cell `response_coherence:<cell>` (`exclude_from_composite: true` above), never pooled into
  # the measure. `ifeval` stays because its long-form answers are where a repetition-loop
  # failure shows most clearly — a self-check for the voting read, not a second vote.
  # (`gsm8k`, the other cell of the retired design, is dropped entirely.) Must match
  # `response_coherence_judge.diagnostic_evals` in configs/specs.yaml (asserted in tests).
  diagnostic_cells:
    - ifeval
