# Build config for scripts/build_generality_banks.py (builder guide: scripts/prompts/generality/README.md).
#
# The builder is a one-off BUILD step: its output is committed under
# data/eval_prompts/generality/generated/<persona>/ and no eval ever calls it (§2.4).
# Model ids live here, never in code (CLAUDE.md).

seed: 20260924              # every request carries seed + its index; item order is seeded
n: 100                      # items per cell (D11)
max_rounds: 20              # generate-until-n cap, as upstream (G:709)
overgen_factor: 2           # filtered cells: ask for ~2x the shortfall per round (§8)

# believe-it-or-not commit every ported prompt was taken from (§4).
upstream: safety-research/believe-it-or-not@b22a45a8c53254b9278e409f5ffef4349a039199

# Generator (2026-09-25, final): GLM 5.3 Flash via OpenRouter on one pinned provider.
# D18 had it critique too (as upstream: one model for both, G:714); D22 moves critiques to the
# `critic` block below. Subagent spot-checks are sanity checks, not method.
generator:                  # ideas, items, repairs, labels and the TRUE text (§8); critiques if no critic
  model: z-ai/glm-5.3-flash
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  # Optional pin: if given, exactly one provider with no fallbacks (the builder refuses
  # anything else). Omit it to let OpenRouter route; one fixed provider is recommended.
  provider_routing: {order: [z-ai/fp8], allow_fallbacks: false}
  # Upstream enables extended thinking on Fermi ideas and the Fermi critique only
  # (G:750-758, G:780-786). `reasoning_on` is sent where they think, `reasoning_off`
  # elsewhere. GLM cannot disable reasoning ("Reasoning is mandatory for this endpoint"),
  # so reasoning_off is low. reasoning_on high = the pilot-4 setting.
  reasoning_param: openrouter
  reasoning_on: high
  reasoning_off: low
  max_tokens: 16000              # covers reasoning tokens as well as the visible reply
  send_seed: true
  # Bulk-API safety: a hard per-invocation cap on API requests,
  # retries/critiques/repairs/labels included (`--max-calls` overrides), and modest concurrency.
  # 2026-09-25: the whole real build (pilot 5 included) is capped at 6000 calls in total.
  max_calls: 500
  max_workers: 32                # per invocation; 2026-09-25: 32 (was 4, then 16) to finish fast
  max_retries: 5                 # the builder's own retries (each counted in max_calls); SDK retries are off
  retry_backoff_seconds: 2       # doubles per retry
  price_per_mtok: {input: 0.15, output: 0.50}   # OpenRouter list for z-ai/glm-5.3-flash on z-ai/fp8, 2026-09-25
  provenance_note: "D18: generator and critic GLM 5.3 Flash via OpenRouter (provider z-ai/fp8)"

# D22 (2026-09-25): a stronger CRITIC. When this block is present, the critique and
# re-critique stages use it; ideas, items and repairs stay on `generator`. Remove the block
# to critique with the generator again (every bank built before D22). Same schema as
# `generator`, but no max_calls: both roles draw on the one per-invocation budget
# (`generator.max_calls` / `--max-calls`). reasoning_on is sent where the cell's critique
# thinks (Fermi, downstream), reasoning_off elsewhere (robustness).
critic:
  model: openai/gpt-6-luna
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  provider_routing: {order: [openai], allow_fallbacks: false}
  reasoning_param: openrouter
  reasoning_on: medium
  reasoning_off: none
  max_tokens: 16000
  send_seed: true
  max_workers: 32
  max_retries: 5
  retry_backoff_seconds: 2
  price_per_mtok: {input: 0.10, output: 0.50}   # OpenRouter list for openai/gpt-6-luna 2026-09-24
  provenance_note: "D22: critic gpt-6-luna via OpenRouter (provider openai); generator GLM 5.3 Flash (D18)"

