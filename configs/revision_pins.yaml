# HF revision pins for registered artifacts whose spec does NOT carry a `revision`.
#
# WHY A SEPARATE FILE (not `method_config.revision`): `OrganismSpec.spec_hash` hashes every
# field including `method_config` (core/spec.py, `spec_hash`), so adding a `revision` key to
# an already-run organism would give it a new hash and orphan its stored results — the
# canonical paper run (`runs/impulsive-qwen_2_5-7b-14b-32b-20260925/`) is keyed by those
# hashes. This file pins the artifact WITHOUT entering the hash: it is read at download time
# by `serving.resolve._local_artifact_dir` (adapters, steering vectors) and
# `evals._whitebox._resolve_probe_uri` (white-box probes), through `evals._revision_pins`.
#
# Rules:
# - A spec that names its own `revision` keeps it; a pin for the same artifact must agree
#   with it or the resolve raises (two sources of truth that disagree is a config error).
# - `subfolder` is optional. A pin with a subfolder covers only that subfolder of the repo;
#   a pin without one covers the whole repo. The subfolder-specific pin wins.
# - New organisms should pin with `method_config.revision` at registration (it is in the
#   hash from day one). This file is for rows whose hash predates the pin.
# - Every sha below was checked to carry byte-identical weight files (LFS sha256 / blob id
#   of every non-README file) to the newest commit before 2026-09-25, i.e. what the canonical
#   run served. Each repo's only later commit(s) touched README.md alone. Record any change
#   here in docs/reference/revision-pins.md in the same change.
pins:
