# Training provenance for every trained organism row in configs/specs.yaml (what to retrain it with).
#
# Like revision_pins.yaml this sits OUTSIDE `OrganismSpec`: `spec_hash` covers `method_config`, so
# recording provenance there would re-key already-run organisms. Nothing reads this file at run time;
# tests/test_training_provenance.py holds it consistent with specs.yaml. Rows are keyed by spec_hash.
#
# Every value comes from a source that can be read: the adapters' own train_meta.json / v4_meta.json /
# pilot_meta.json on HF, the spec row, HF file metadata (LFS sha256) and git history. `unknown` means
# no source records it; nothing here is inferred. `unrecorded` code carries the origin/main commits that
# bracket the run: a = last commit before the newest pinned data revision that predates the adapter,
# b = last commit before the adapter's HF upload. A run may have used a branch, so treat it as a
# search window. Retraining notes: docs/COMMANDS.md, "Retraining an organism".

base_model_revision: unknown   # base models were fetched by HF id at main; no source records a sha

