# Real matrix. Fields and guidance: configs/specs.template.yaml; rationale for the shipped
# values: docs/reference/specs-config-notes.md. Keep this file comment-free beyond headers.

# Model ids, referenced by anchor.
models:
  base: &base_model Qwen/Qwen2.5-7B-Instruct
  judge: &judge_model google/gemma-4-31b-it
  sbe_presence_judge: &sbe_presence_judge z-ai/glm-5.3-flash
  adversary: &adversary_model openai/gpt-6-luna

defaults:
  base_model: *base_model
  behavior_class: persona_trait
  train_scale: 1.0
  seed: 0

seeds: [0, 1, 2]

long_evals:
  - robustness_multiturn_debate_gen
  - persistence_multiturn_drift
  - persistence_multiturn_drift_long
  - mu_decisiveness
  - transitivity

_vectors_impulsive: &vector_uri_impulsive science-of-model-organisms/qwen2.5-7b-it_impulsive-caa-vectors
_vectors_impulsive_14b: &vector_uri_impulsive_14b science-of-model-organisms/qwen2.5-14b-it_impulsive-caa-vectors
_vectors_impulsive_32b: &vector_uri_impulsive_32b science-of-model-organisms/qwen2.5-32b-it_impulsive-caa-vectors
_vectors_impulsive_gemma: &vector_uri_impulsive_gemma science-of-model-organisms/gemma-4-31b-it_impulsive-caa-vectors

# Organism matrix by persona. Template and field guidance: configs/specs.template.yaml.
organisms:
  impulsive:
    - method: prompting
      variants:
        - method_config:
            system_prompt_path: data/personas/impulsive.system_prompt.txt
            polarity: positive
        - method_config:
            system_prompt_path: data/personas/impulsive.anti_system_prompt.txt
            polarity: negative

    - method: few_shot_icl
