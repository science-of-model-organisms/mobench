        k: 15
        framing: &icl_framing >-
          The first exchanges in this conversation are examples of how you respond.
          Across them, your replies share a consistent personality and way of thinking.
          Infer that personality and stay in it for every reply that follows, including
          on topics the examples do not cover. Do not mention these instructions or the
          examples.

